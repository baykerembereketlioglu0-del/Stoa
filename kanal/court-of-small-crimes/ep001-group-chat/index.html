<script>

function sEvidence(t) {

function sDiffuse(t) {

function sVerdict(t) {

  const g = C.guilty, gav = t < g - 0.05 ? -1.0 * ss(S.verdict.start + 0.2, g - 0.4, t) : 0.12 * Math.exp(-(t - g) * 10);

  x.restore();
  const slump = ss(g + 0.15, g + 0.7, t); for (let i = 0; i < 6; i++) defendant(130 + i * 164, 1330, 0.52, i + 1, 1, slump);

function sSentence(t) {

  txt('ask ONE person, by name', 84, 238, '54px Caveat', '#ffe7b0', ss(C.ask - 0.2, C.ask + 0.4, t), 'left');
  x.save(); x.beginPath(); x.arc(890, 190, 130, 0, TAU); x.clip(); x.fillStyle = PAL.wall; x.fillRect(700, 0, 400, 400); judgeAgatha(890, 262, 0.55, talk('judge', t), { look: [-0.5, 0.2] }); x.restore();

  txt('YOUR VERDICT?', 540, 760, '150px "Bebas Neue"', PAL.ink, ss(C.yourVerdict - 0.2, C.yourVerdict + 0.3, t), 'center', 8);

const SCN = { title: sTitle, dock: sDock, evidence: sEvidence, expert: sExpert, diffuse: sDiffuse, verdict: sVerdict, sentence: sSentence, outro: sOutro };

// ---------- court transcript captions ----------
const CHUNKS = [];
LN.forEach(l => { let cur = [], len = 0; l.words.forEach((w, k) => { cur.push(w); len += w[0].length + 1; if (/[.?!:]$/.test(w[0]) || len > 40 || k === l.words.length - 1) { CHUNKS.push({ who: l.who, words: cur, s: cur[0][1], e: cur[cur.length - 1][2] + 0.25 }); cur = []; len = 0; } }); });

}

// ---------- render ----------
const IMPACTS = C.fx.filter(f => f.type === 'gavel' || f.type === 'stamp').map(f => [f.t, f.type === 'gavel' ? 14 * f.g : 8 * f.g]);

Promise.all(['64px "Special Elite"', '64px "Bebas Neue"', '700 64px Caveat', '500 40px Inter'].map(f => document.fonts.load(f, 'AaZz'))).then(() => {
  window.seekTo = tt => { render(tt); return true; };

  pp.onclick = () => { play = !play; pp.textContent = play ? 'Pause' : 'Play'; last = null; sync(); };

});
