// ---------- court transcript captions ----------
const CHUNKS = [];
LN.forEach((l, li) => { let cur = [], len = 0; l.words.forEach((w, k) => { cur.push(w); len += w[0].length + 1; if (/[.?!:]$/.test(w[0]) || len > 40 || k === l.words.length - 1) { CHUNKS.push({ who: l.who, words: cur, s: cur[0][1], e: cur[cur.length - 1][2] + 0.25 }); cur = []; len = 0; } }); });

Promise.all(['64px "Special Elite"', '64px "Bebas Neue"', '700 64px Caveat'].map(f => document.fonts.load(f, 'AaZz'))).then(() => {

});
