<script>
const capMode = location.search.includes('capture=1'); if (capMode) document.body.classList.add('cap');
const TL = window.TIMELINE || EP.estimateTimeline(), LN = TL.lines, DUR = TL.duration, C = EP.cues(TL), S = C.scenes; window.DURATION = DUR;
const sceneOf = t => { for (const n of EP.SCENES) if (t >= S[n].start && t < S[n].end) return n; return 'outro'; };
function talk(who, t) { for (const l of LN) if (l.who === who && t >= l.start - 0.05 && t <= l.end + 0.05) { for (const w of l.words) if (t >= w[1] && t <= w[2]) return 0.3 + 0.7 * Math.abs(Math.sin(t * 15)); return 0.05; } return 0; }
function camera(t, keys) { let z = keys[0][1], fx = keys[0][2], fy = keys[0][3]; for (let i = 1; i < keys.length; i++) { const k = keys[i], e = ss(k[0], k[0] + (k[4] ?? 0.8), t); z = lerp(z, k[1], e); fx = lerp(fx, k[2], e); fy = lerp(fy, k[3], e); } x.translate(W / 2, H / 2); x.scale(z, z); x.translate(-fx, -fy); }
function dim(a) { x.fillStyle = `rgba(40,24,14,${a})`; x.fillRect(-100, -100, W + 200, H + 200); }
// the room is drawn once into a layer and reused (it never changes except the clouds)
const ROOM = document.createElement('canvas'); ROOM.width = W; ROOM.height = H; let roomKey = '';
function room(variant = 'full') { if (roomKey !== variant) { const m = x; x = ROOM.getContext('2d'); x.lineJoin = x.lineCap = 'round'; x.clearRect(0, 0, W, H); courtroom(1040, 1330, { seal: variant === 'full' }); x = m; roomKey = variant; } x.drawImage(ROOM, 0, 0); }

// ---------- scenes ----------
const talking = (who, t) => talk(who, t);
function judgeAtBench(t, cx, benchTop, h, extra = {}) { x.save(); x.beginPath(); x.rect(-500, -500, W + 1000, benchTop + 250 + 500); x.clip(); person(cx, benchTop + h * 0.42, h, LOOK.judge, { talk: talking('judge', t), brows: 0.3, smile: -0.1, armL: [0.25, -0.9], armR: [0.25, -0.9], ...extra }); x.restore(); }
const shiver = (a = 1) => Math.sin(T * 47) * 3.2 * a;
// ---- props ----
function thermostat(cx, cy, s, temp, on) {
  paint(RR(cx - 70 * s, cy - 90 * s, 140 * s, 180 * s, 18 * s), '#f4f1ea', { sh: [0, 8 * s], lw: 4 });
  paint(E(cx, cy + 6 * s, 52 * s, 52 * s), on ? '#ffd9b0' : '#e3e7ea', { lw: 4 });
  for (let i = 0; i < 13; i++) { const a = PI * 0.75 + i / 12 * PI * 1.5; stroke([cx + Math.cos(a) * 40 * s, cy + 6 * s + Math.sin(a) * 40 * s, cx + Math.cos(a) * 47 * s, cy + 6 * s + Math.sin(a) * 47 * s], 2.5, '#6b6258'); }
  const ang = PI * 0.75 + cl((temp - 10) / 20, 0, 1) * PI * 1.5; stroke([cx, cy + 6 * s, cx + Math.cos(ang) * 34 * s, cy + 6 * s + Math.sin(ang) * 34 * s], 6, on ? PAL.red : OUT);
  txt(temp + '°', cx, cy - 58 * s, `${34 * s}px "Bebas Neue"`, on ? PAL.red : '#55606a', 1, 'center', 2);
  if (on) { x.save(); x.globalAlpha = 0.5 + 0.2 * Math.sin(T * 6); paint(E(cx + 50 * s, cy - 70 * s, 7 * s, 7 * s), '#ff7a2a', { shade: false, lw: 0 }); x.restore(); }
}
function radiator(x0, y0, w, h, heat) {
  paint(RR(x0, y0, w, h, 12), '#eef0f1', { sh: [0, 8], lw: 4 });
  for (let i = 1; i < 9; i++) stroke([x0 + i * w / 9, y0 + 14, x0 + i * w / 9, y0 + h - 14], 3, '#b9c1c7');
  if (heat > 0) { x.save(); x.globalAlpha = heat * 0.75; for (let i = 0; i < 5; i++) { const px = x0 + 40 + i * (w - 80) / 4, ph = (T * 0.8 + i * 0.3) % 1; x.beginPath(); for (let k = 0; k <= 20; k++) { const yy = y0 - 10 - k * 9 - ph * 30, xx = px + Math.sin(k * 0.6 + T * 4 + i) * 9; k ? x.lineTo(xx, yy) : x.moveTo(xx, yy); } x.lineWidth = 5; x.strokeStyle = '#ff9a4a'; x.stroke(); } x.restore(); }
}
function homeRoom(cold = 1) {
  x.fillStyle = '#d6dde2'; x.fillRect(0, 0, W, 1250);
  for (let i = 0; i < 12; i++) stroke([i * 96 + 30, 0, i * 96 + 30, 1250], 2, 'rgba(120,140,160,.18)');
  paint(RR(90, 230, 470, 560, 10), '#f4f1ea', { sh: [0, 10], lw: 6 }); paint(RR(116, 256, 418, 508, 4), '#9fb4c4', { shade: false, lw: 4 });

  if (cold > 0) { x.save(); x.globalAlpha = 0.55 * cold; x.fillStyle = '#ffffff'; for (const [a, b, c] of [[116, 256, 150], [534, 256, 120], [116, 764, 130], [534, 764, 150]]) { x.beginPath(); x.arc(a, b, c, 0, TAU); x.fill(); } x.restore(); }
  x.fillStyle = '#8a6a4a'; x.fillRect(0, 1250, W, H); for (let i = 0; i < 9; i++) stroke([0, 1250 + i * 70, W, 1250 + i * 70], 3, 'rgba(60,40,25,.35)');
  stroke([0, 1250, W, 1250], 6);
}
function calendar(cx, cy, w, h, crossN, k3) {
  paint(RR(cx - w / 2, cy - h / 2, w, h, 16), PAL.white, { sh: [0, 12], lw: 5 });
  paint(RR(cx - w / 2, cy - h / 2, w, 120, 16), PAL.red, { shade: false, lw: 5 }); txt('OCTOBER', cx, cy - h / 2 + 62, '78px "Bebas Neue"', '#fff', 1, 'center', 6);
  const cw = (w - 60) / 7, ch = (h - 170) / 5;
  for (let d = 1; d <= 31; d++) { const i = d - 1, gx = cx - w / 2 + 30 + (i % 7) * cw + cw / 2, gy = cy - h / 2 + 150 + Math.floor(i / 7) * ch + ch / 2;
    txt(String(d), gx, gy, '44px "Bebas Neue"', d <= 3 ? PAL.ink : '#9a8f80', 1);
    if (d <= crossN) { const k = cl(crossN - d + 1, 0, 1); stroke([gx - 30, gy - 30, gx - 30 + 60 * k, gy - 30 + 60 * k], 7, PAL.red); if (k > 0.5) stroke([gx + 30, gy - 30, gx + 30 - 60 * (k - 0.5) * 2, gy - 30 + 60 * (k - 0.5) * 2], 7, PAL.red); }
    if (d === 3 && k3 > 0) { x.save(); x.globalAlpha = k3; x.beginPath(); x.ellipse(gx, gy, 52 * (0.6 + 0.4 * k3), 46 * (0.6 + 0.4 * k3), -0.2, 0, TAU * k3); x.lineWidth = 8; x.strokeStyle = PAL.red; x.stroke(); x.restore(); }
  }
}
function card(t0, t, s, y = 110) { const k = ss(t0 - 0.1, t0 + 0.4, t); if (k <= 0) return; x.save(); x.globalAlpha = k; x.translate(540, y); x.rotate(-0.015); paint(RR(-440, -56, 880, 112, 14), PAL.cream, { sh: [0, 10], lw: 5 }); x.restore(); txt(s.slice(0, Math.ceil(s.length * ss(t0, t0 + 1, t))), 540, y + 2, '48px "Special Elite"', PAL.ink, k, 'center', 2, -0.015); }
function snow(a, x0 = 0, x1 = W, y0 = 0, y1 = H) { if (a <= 0) return; x.save(); x.globalAlpha = a; for (let i = 0; i < 26; i++) { const sx = x0 + R(i) * (x1 - x0), sy = y0 + ((T * (60 + R(i + 9) * 50) + R(i + 4) * (y1 - y0)) % (y1 - y0)); txt('✻', sx + Math.sin(T + i) * 10, sy, '34px Inter', '#ffffff', 1); } x.restore(); }

function sTitle(t) {
  room('full');
  x.save(); camera(t, [[0, 1.12, 540, 760], [0, 1.0, 540, 900, 3]]);
  const h1 = C.rise - 0.25, h2 = C.title;
  const up = t < h1 ? ss(0.2, h1 - 0.1, t) : t < h2 ? ss(h1 + 0.15, h2 - 0.35, t) * (1 - ss(h2 - 0.12, h2, t)) : 0;
  paint(RR(330, 1210, 420, 70, 18), PAL.woodDark, { sh: [0, 12], hl: [450, 1220, 120] });
  x.save(); x.translate(900, 1170); x.rotate(-1.5 + up * 0.85);
  paint(RR(-9, -300, 18, 300, 8), PAL.woodLight, { sh: [5, 0], lw: 4 });
  paint(RR(-110, -350, 220, 92, 18), PAL.woodDark, { sh: [0, 12], hl: [-50, -340, 90] }); stroke([-110, -325, 110, -325], 5, PAL.gold); stroke([-110, -283, 110, -283], 5, PAL.gold);
  x.restore();
  for (const h of [h1, h2]) if (t > h && t < h + 0.3) { const k = (t - h) / 0.3; x.save(); x.globalAlpha = 1 - k; for (let i = 0; i < 9; i++) { const a = PI + 0.15 + i / 8 * (PI - 0.3); stroke([560 + Math.cos(a) * (150 + k * 60), 1200 + Math.sin(a) * (70 + k * 40), 560 + Math.cos(a) * (210 + k * 120), 1200 + Math.sin(a) * (90 + k * 70)], 7); } x.restore(); }
  x.restore();
  const k1 = ss(C.rise, C.rise + 0.4, t);
  if (k1 > 0) { x.save(); x.globalAlpha = k1; paint(RR(170, 640, 740, 380, 26), PAL.cream, { sh: [0, 14], lw: 6 }); x.restore(); }
  txt('THE COURT OF', 540, 712, '66px "Special Elite"', PAL.ink, k1, 'center', 8);
  stamp('SMALL CRIMES', 540, 840, 168, ss(h2, h2 + 0.18, t), -0.05);
  txt('every case backed by real research', 540, 960, '50px Caveat', PAL.oxblood, ss(h2 + 0.4, h2 + 1, t));
}
function sDock(t) {
  if (t < C.heating - 0.25) {
    room('noseal'); seal(540, 250, 110);
    x.save(); camera(t, [[S.dock.start, 1.12, 540, 700], [S.dock.start, 1.04, 540, 820, 2]]);
    judgeAtBench(t, 540, 760, 1000); bench(540, 760, 820, 300);
    x.restore();
  } else {
    const on = t > C.heating + 0.1;
    homeRoom(on ? 1 - ss(C.heating, C.heating + 2.5, t) : 1);
    x.save(); camera(t, [[C.heating - 0.25, 1.15, 640, 820], [C.heating - 0.25, 1.0, 540, 900, 2.2]]);
    radiator(120, 920, 420, 230, ss(C.heating + 0.2, C.heating + 1.2, t));
    thermostat(800, 560, 1.2, on ? 21 : 15, on);
    const reach = ss(C.heating - 0.25, C.heating, t) * (1 - ss(C.heating + 0.6, C.heating + 1.2, t));
    const relief = ss(C.heating + 0.8, C.heating + 1.6, t);
    person(500 + shiver(1 - relief), 1420, 1000, LOOK.mia, { armR: [lerp(0.4, 2.2, reach), lerp(-2.3, 0.15, reach)], armL: [0.4, -2.3], smile: lerp(-0.5, 0.9, relief), brows: lerp(-0.4, 0.3, relief), look: [reach * 0.7, -reach * 0.3] });
    x.restore();
    snow(1 - ss(C.heating, C.heating + 1.5, t), 0, W, 0, 1250);
    if (t > C.third - 0.2) { const k = ss(C.third - 0.2, C.third + 0.2, t); x.save(); x.globalAlpha = k; x.translate(880, 1040); x.rotate(0.06); x.scale(0.4, 0.4); calendar(0, 0, 760, 800, 0, ss(C.october, C.october + 0.5, t)); x.restore(); }
  }
  card(LN[1].start - 0.1, t, 'CASE Nº 002 — THE THERMOSTAT');
}
function sEvidence(t) {
  room('full'); dim(0.25);
  const cal = t > C.lasted - 0.3;
  x.save(); camera(t, [[S.evidence.start, 1.0, 540, 960]]);
  if (!cal) {
    x.save(); x.translate(750, 720); x.rotate(0.03);
    paint(RR(-270, -360, 560, 720, 14), '#fff8e6', { sh: [0, 14], lw: 5 });
    paint(E(0, -340, 22, 22), PAL.red, { lw: 4 });
    txt('HOUSE RULES', 0, -250, '76px "Bebas Neue"', PAL.ink, 1, 'center', 6); stroke([-200, -205, 200, -205], 4);
    const k = ss(C.nobody - 0.2, C.nobody + 0.3, t);
    txt('1. NOBODY touches', -215, -110, '58px Caveat', PAL.ink, k, 'left'); txt('the thermostat', -215, -40, '58px Caveat', PAL.ink, k, 'left');
    txt('until NOVEMBER.', -215, 30, '58px Caveat', PAL.ink, ss(C.november - 0.2, C.november + 0.3, t), 'left');
    paint(RR(-60, 110, 130, 130, 20), '#ececec', { lw: 4 }); thermostat(5, 175, 0.55, 15, false);
    stroke([-170, 70, 180, 70], 0.1);
    txt('signed: everyone', -215, 300, '42px Caveat', PAL.oxblood, k, 'left');
    x.restore();
  } else {
    calendar(680, 760, 640, 720, cl((t - C.lasted) / 0.35, 0, 3) + (t > C.threeA ? 0.01 : 0), ss(C.threeA, C.threeA + 0.4, t));
    const k = ss(C.threeB - 0.1, C.threeB + 0.25, t);
    if (k > 0) txt('3 DAYS', 680, 1200, `${170 * (0.7 + 0.3 * easeBack(k))}px "Bebas Neue"`, PAL.red, k, 'center', 8, -0.06);
  }
  x.restore();
  person(210, 1440, 980, LOOK.prosecutor, { talk: talking('prosecutor', t), armR: [1.42 + 0.06 * Math.sin(T * 3), 0.05], armL: [0.12, 0.1], brows: cal ? -0.6 : 0.3, smile: cal ? 0.9 : 0.2, look: [0.6, 0] });
  stamp('EXHIBIT A', 840, 170, 96, ss(S.evidence.start + 0.2, S.evidence.start + 0.45, t), 0.08);
}
function sShorts(t) {
  homeRoom(1);
  x.save(); camera(t, [[S.shorts.start, 1.08, 540, 900], [S.shorts.start, 1.0, 540, 960, 2.5]]);
  radiator(120, 920, 420, 230, 0); thermostat(940, 600, 0.9, 15, false);
  person(330 + shiver(), 1440, 900, LOOK.mia, { armL: [0.4, -2.3], armR: [0.4, -2.3], smile: -0.6, brows: -0.5, look: [0.6, 0] });

  // ice lolly in Dan's raised hand
  x.save(); x.translate(818, 790); x.rotate(0.2); paint(RR(-20, -80, 40, 80, 18), '#ff7aa8', { lw: 4 }); stroke([0, 0, 0, 30], 7, '#d9b07a'); x.restore();
  x.restore();
  snow(0.8, 0, 520, 0, 1250);
  txt('MEANWHILE…', 540, 150, '84px "Special Elite"', PAL.ink, ss(C.meanwhile - 0.2, C.meanwhile + 0.3, t), 'center', 4);
  if (k > 0) { stamp('SHORTS', 790, 1230, 110, k, 0.12, PAL.navy); txt('in October', 790, 1330, '54px Caveat', PAL.oxblood, k); }
  txt('15°C', 940, 470, '64px "Bebas Neue"', '#3d6aa8', ss(C.meanwhile, C.meanwhile + 0.4, t));
}
function chalkMan(cx, base, s, a) { if (a <= 0) return; x.save(); x.globalAlpha = a; x.strokeStyle = '#f3eee2'; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath(); x.arc(cx, base - 170 * s, 26 * s, 0, TAU); x.moveTo(cx, base - 144 * s); x.lineTo(cx, base - 60 * s); x.moveTo(cx, base - 120 * s); x.lineTo(cx - 44 * s, base - 80 * s); x.moveTo(cx, base - 120 * s); x.lineTo(cx + 44 * s, base - 80 * s); x.moveTo(cx, base - 60 * s); x.lineTo(cx - 30 * s, base); x.moveTo(cx, base - 60 * s); x.lineTo(cx + 30 * s, base); x.stroke(); x.restore(); }
function sExpert(t) {
  const call = LN[EP.ID.call];
  if (t < call.end + 0.35) { room('noseal'); seal(540, 250, 110); x.save(); camera(t, [[S.expert.start, 1.18, 540, 700]]); judgeAtBench(t, 540, 760, 1000, { look: [0.5, 0] }); bench(540, 760, 820, 300); x.restore(); return; }
  room('noseal');
  paint(RR(40, 200, 640, 900, 20), PAL.woodDark, { sh: [0, 14], lw: 6 }); paint(RR(66, 226, 588, 848, 10), PAL.chalk, { shade: false, lw: 4 });
  const st = t > C.y2015 - 0.3;

    txt('age 40', 220, 600, '56px Caveat', '#ffe7b0', ss(C.forty - 0.1, C.forty + 0.3, t)); txt('70 kg', 520, 600, '56px Caveat', '#ffe7b0', ss(C.seventy - 0.1, C.seventy + 0.3, t));
    txt('the "standard" body', 360, 960, '46px Caveat', '#d9d4c8', ss(C.seventy + 0.3, C.seventy + 0.8, t));
  } else {
    txt('THE 2015 STUDY', 360, 310, '62px "Bebas Neue"', '#f3eee2', 1, 'center', 4); txt('Kingma & van Marken Lichtenbelt', 360, 372, '36px Caveat', '#d9d4c8', 0.9);
    const base = 940, hMax = 440, b1 = ss(C.overest - 0.1, C.overest + 0.7, t), b2 = ss(C.woman - 0.1, C.woman + 0.8, t) * 0.65;

    if (b2 > 0) { paint(RR(420, base - hMax * b2, 170, hMax * b2, 8), '#7fb2e8', { sh: [10, 0], lw: 4, line: '#f3eee2' }); txt('a woman, desk work', 505, base + 46, '36px Caveat', '#f3eee2', b2 / 0.65); }
    const kk = ss(C.thirty - 0.1, C.thirty + 0.4, t); if (kk > 0) { txt('up to −35%', 505, base - hMax - 40, '76px "Bebas Neue"', '#ff8a7a', kk); stroke([420, base - hMax, 590, base - hMax], 4, '#ff8a7a'); }
  }
  person(860, 1440, 940, LOOK.expert, { talk: talking('expert', t), armL: [1.05 + 0.08 * Math.sin(T * 1.6), -0.35], armR: [0.14, 0.12], pointer: 'L', look: [-0.6, 0], brows: 0.1, smile: 0.4 });
}
function sSame(t) {

  x.save(); x.fillStyle = 'rgba(255,150,60,.14)'; x.fillRect(0, 0, 540, H); x.fillStyle = 'rgba(80,140,230,.16)'; x.fillRect(540, 0, 540, H); x.restore();

  // warm aura vs cold aura

  person(280, 1440, 760, LOOK.dan, { armL: [0.2, 0.05], armR: [0.2, 0.05], smile: 1, brows: 0.3, look: [0.3, 0] });
  person(800 + shiver(), 1440, 760, LOOK.mia, { armL: [0.4, -2.3], armR: [0.4, -2.3], smile: -0.6, brows: -0.5, look: [-0.3, 0] });
  snow(a2 * 0.9, 560, W, 400, 1440);
  txt('comfy', 280, 600, '64px Caveat', PAL.oxblood, a1); txt('freezing', 800, 600, '64px Caveat', '#2f4870', a2);
  txt('SAME ROOM.', 540, 120, '96px "Bebas Neue"', PAL.ink, a1, 'center', 6);

// ---------- court transcript captions ----------
const CHUNKS = [];
LN.forEach(l => { let cur = [], len = 0; l.words.forEach((w, k) => { cur.push(w); len += w[0].length + 1; if (/[.?!:]$/.test(w[0]) || len > 40 || k === l.words.length - 1) { CHUNKS.push({ who: l.who, words: cur, s: cur[0][1], e: cur[cur.length - 1][2] + 0.25 }); cur = []; len = 0; } }); });
CHUNKS.forEach((c, i) => { if (i < CHUNKS.length - 1) c.e = Math.min(c.e, CHUNKS[i + 1].s); });
function captions(t) {
  const c = CHUNKS.find(c => t >= c.s - 0.05 && t < c.e); if (!c) return;

    if (t >= s0 && t < e0 + 0.08) { x.fillStyle = 'rgba(245,200,60,.7)'; x.beginPath(); x.roundRect(px - 6, py - 26, ww + 12, 50, 6); x.fill(); }
    if (t >= s0 - 0.02) { x.fillStyle = PAL.ink; x.fillText(w, px, py); }

}

// ---------- render ----------
const IMPACTS = C.fx.filter(f => f.type === 'gavel' || f.type === 'stamp').map(f => [f.t, f.type === 'gavel' ? 14 * f.g : 8 * f.g]);

  x.save(); x.translate(Math.sin(t * 91) * sh, Math.cos(t * 77) * sh); SCN[sceneOf(t)](t); x.restore();
  for (const n of EP.SCENES.slice(1)) { const k = (t - S[n].start) / 0.3; if (k >= 0 && k < 1) { const e = easeOut(k), px = W * (1 - e); x.fillStyle = PAL.cream; x.fillRect(0, 0, px, H); stroke([px, 0, px, H], 6); } }

  if (t < 0.3) { x.fillStyle = `rgba(0,0,0,${1 - t / 0.3})`; x.fillRect(0, 0, W, H); }
}
Promise.all(['64px "Special Elite"', '64px "Bebas Neue"', '700 64px Caveat', '500 40px Inter'].map(f => document.fonts.load(f, 'AaZz'))).then(() => {
  window.seekTo = tt => { render(tt); return true; };
  render(capMode ? 0 : 3.5); if (capMode) return;
  let now = 0, play = false, last = null; const pp = document.getElementById('pp'), sl = document.getElementById('sl'), tm = document.getElementById('tm'), A = [document.getElementById('a1'), document.getElementById('a2')];

  sl.oninput = () => { now = +sl.value; render(now); tm.textContent = now.toFixed(1); sync(); };

});
