<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fizik Defteri: Tork ve Denge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ders kâğıdı (sayfalar her zaman açık renk); kuvvet renkleri anlam taşır */
  --paper:#fffdf8; --panel:#ffffff; --ink:#17212b; --muted:#5a6672; --line:#d3dade; --grid:rgba(60,110,170,.10);
  --accent:#c2410c; --blue:#1f5fae; --green:#2e7d32; --red:#b42318; --soft:#fbf0e7; --tint:#e8eef6;
  /* Uygulama kabuğu koyu: projeksiyonda sayfa öne çıksın. Düzen: üst araç çubuğu, solda sayfa listesi, ortada defter */
  --shell:#11161b; --bar:#1a2128; --bar2:#28323c; --bar-ink:#e8edf2; --bar-mute:#8e9ba7; --hot:#ff7a3d;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--bar-ink);font:400 16px/1.5 var(--body);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:inherit}
/* ---------- toolbar ---------- */
#bar{display:flex;align-items:center;gap:4px;padding:7px 8px;background:var(--bar);border-bottom:1px solid #000;overflow-x:auto;scrollbar-width:thin}
.grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--bar2);flex:none}
.grp:last-child{border-right:0}
.tb{height:38px;min-width:38px;padding:0 8px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--bar-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px/1 var(--display);cursor:pointer;white-space:nowrap;flex:none}
.tb:hover{background:var(--bar2)}
.tb:focus-visible,.sw:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.tb[aria-pressed="true"]{background:var(--hot);color:#1d1209}
.tb svg{width:20px;height:20px;flex:none}
.tb.warn{background:#c4342b;color:#fff}
.tb .lbl{display:none}
@media (min-width:1500px){.tb .lbl{display:inline}}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--bar);box-shadow:0 0 0 1px #4a5560;cursor:pointer;flex:none;background:var(--c);padding:0;margin:0 2px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--hot)}
#cpick{width:28px;height:28px;padding:0;border:0;background:none;cursor:pointer;flex:none}
#wrange{width:84px;accent-color:var(--hot)}
.wprev{width:26px;height:26px;display:grid;place-items:center;flex:none}
.wprev i{display:block;border-radius:50%;background:var(--bar-ink)}
select{height:34px;background:var(--bar2);color:var(--bar-ink);border:1px solid #39444f;border-radius:8px;font:600 13px var(--display);padding:0 6px}
#zl{font:700 13px var(--display);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
#pgi{font:700 13px var(--display);color:var(--bar-mute);padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- layout ---------- */
#main{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0}
#side{width:230px;background:var(--bar);border-right:1px solid #000;overflow-y:auto;padding:10px 8px}
body.noside #side{display:none}
body.noside #main{grid-template-columns:minmax(0,1fr)}
#side h2{font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--bar-mute);margin:6px 8px 10px}
#plist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#plist li{display:flex;align-items:center;gap:2px}
#plist .go{flex:1;display:flex;gap:8px;align-items:baseline;text-align:left;padding:7px 8px;border-radius:8px;border:0;background:transparent;color:var(--bar-ink);font:600 13.5px/1.25 var(--display);cursor:pointer;min-width:0}
#plist .go span{color:var(--bar-mute);font-variant-numeric:tabular-nums;min-width:1.6em}
#plist .go em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plist .go:hover{background:var(--bar2)}
#plist li.cur .go{background:var(--bar2);box-shadow:inset 3px 0 0 var(--hot)}
#plist .del{border:0;background:transparent;color:var(--bar-mute);width:28px;height:28px;border-radius:6px;cursor:pointer;font:700 15px var(--display)}
#plist .del:hover{background:#3a2020;color:#ff8b80}
#plist .del.warn{background:#c4342b;color:#fff;width:auto;padding:0 8px;font-size:12px}
.sidebtns{display:grid;gap:6px;margin-top:12px}
.sidebtns .tb{justify-content:flex-start;background:var(--bar2)}
.sidebtns .tb .lbl{display:inline}
#viewer{overflow:auto;position:relative;padding:22px 0 90px}
.pwrap{margin:0 auto 26px;position:relative}
/* ---------- page ---------- */
.page{position:absolute;top:0;left:0;width:900px;height:1272px;transform-origin:0 0;background-color:var(--paper);color:var(--ink);box-shadow:0 12px 34px rgba(0,0,0,.5);border-radius:4px;overflow:hidden;font:400 17px/1.55 var(--body)}
.page.bg-grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.page.bg-lined{background-image:linear-gradient(transparent 35px,rgba(60,110,170,.24) 36px);background-size:100% 36px;background-position:0 40px}
.page.bg-dots{background-image:radial-gradient(rgba(60,90,130,.38) 1.3px,transparent 1.7px);background-size:24px 24px}
.page::before{content:"";position:absolute;top:0;bottom:0;left:86px;width:2px;background:rgba(214,60,60,.33);z-index:1}
.page::after{content:"";position:absolute;left:24px;top:30px;bottom:30px;width:28px;background:radial-gradient(circle at 14px 14px,var(--shell) 9px,rgba(0,0,0,.18) 10px,transparent 11.5px) 0 0/28px 101px repeat-y;z-index:1}
.page.pdf::before,.page.pdf::after{display:none}
.pc{position:absolute;inset:52px 54px 58px 114px;display:flex;flex-direction:column;gap:0;overflow:hidden;z-index:2}
.page.pdf .pc{inset:0;align-items:center;justify-content:center}
.pdfslot{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font:600 15px var(--display)}
.pdfslot img{max-width:100%;max-height:100%;display:block;box-shadow:0 0 0 1px var(--line)}
.ink{position:absolute;inset:0;width:900px;height:1272px;z-index:5;touch-action:none;cursor:crosshair}
body.mode-cursor .ink{pointer-events:none}
body.tool-text .ink{cursor:text}
body.tool-eraser .ink{cursor:none}
.pno{position:absolute;bottom:20px;right:30px;font:700 12px var(--display);color:var(--muted);z-index:2;letter-spacing:.06em}
.tedit{position:absolute;z-index:8;min-width:140px;min-height:1.3em;background:rgba(255,253,248,.92);border:1.5px dashed var(--accent);border-radius:4px;font-family:var(--hand);font-weight:700;line-height:1.15;padding:0 4px;resize:none;outline:none;overflow:hidden;white-space:pre;color:inherit}
/* ---------- lesson content ---------- */
.pc h1,.pc h2,.pc h3,.pc h4{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.pc p,.pc ul,.pc ol{margin:0 0 12px}
.pc ul{padding-left:22px}
.pc li{margin:3px 0}
.pc a{color:var(--blue)}
.chhead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.chno{font:900 54px/0.9 var(--display);font-stretch:70%;color:var(--accent);font-variant-numeric:tabular-nums}
.pc h2{font-size:36px;font-weight:850;font-stretch:85%}
.pc h3{font-size:21px;font-weight:800;margin:16px 0 8px}
.runhead{font:800 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:1.5px solid var(--line)}
.f{font:500 16px/1.55 var(--mono);background:var(--soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.f b{color:var(--accent)}
.f small{display:block;font-size:13.5px;color:var(--muted);font-family:var(--body);font-style:italic}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px}
.card h4{font-size:16.5px;margin-bottom:6px}
.card.k h4{color:var(--green)} .card.u h4{color:var(--red)} .card.n h4{color:var(--blue)}
.trap{border:1.5px dashed var(--red);border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--panel);font-size:15.5px}
.trap::before{content:"ÖSYM tuzağı";display:block;font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.steps-box{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:7px}
.steps-box li{counter-increment:s;position:relative;padding:9px 12px 9px 48px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;font-size:15.5px;margin:0}
.steps-box li::before{content:counter(s);position:absolute;left:12px;top:8px;width:25px;height:25px;border-radius:50%;background:var(--ink);color:var(--panel);font:800 13px/25px var(--display);text-align:center}
.tbl{border:1.5px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:15.5px;background:var(--panel)}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
figure.lab{margin:8px 0 12px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.labhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;border-bottom:1.5px solid var(--line);font:800 14px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase}
.labhead span{color:var(--accent)}
.live{font:700 11px/1 var(--display);padding:5px 8px;border-radius:99px;background:var(--accent);color:#fff;letter-spacing:.1em}
figure.lab canvas{display:block;width:100%;height:auto;touch-action:none}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;padding:12px 14px;border-top:1.5px solid var(--line)}
.ctrl label{display:flex;justify-content:space-between;font:600 13.5px/1.3 var(--display);margin-bottom:4px}
.ctrl output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.read{padding:10px 14px;border-top:1.5px solid var(--line);font:500 14.5px/1.55 var(--mono);background:var(--soft)}
.read b{color:var(--accent)}
.pill{display:inline-block;font:800 11px/1 var(--display);padding:5px 8px;border-radius:99px;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.pill.ok{background:var(--green);color:#fff} .pill.no{background:var(--red);color:#fff}
figure.lab figcaption{padding:9px 14px;font-size:14.5px;color:var(--muted);border-top:1.5px solid var(--line)}
.notes{flex:1;min-height:80px;margin-top:10px;border:1.5px dashed #b9c3cb;border-radius:10px;font:700 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:#9aa6b0;padding:8px 10px}
.key{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.key div{border:1.5px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;background:var(--panel);font:800 17px/1.2 var(--display)}
.key small{display:block;font:600 11px/1 var(--display);color:var(--muted)}
.fcard{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fcard div{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.fcard b{display:block;font:800 12px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fcard code{font:500 15px/1.5 var(--mono)}
/* questions */
.qcard{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px 16px}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.qn{font:900 26px/1 var(--display);font-stretch:80%}
.qtag{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--line);padding:5px 8px;border-radius:99px}
.qfig{display:block;width:100%;max-width:640px;height:auto;margin:2px auto}
.stem{margin:6px 0 10px!important}
.opts{list-style:none;padding:0!important;margin:0!important;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.opt{width:100%;display:flex;gap:8px;align-items:center;text-align:left;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:500 16px/1.25 var(--body);cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);font:800 13px/23px var(--display);text-align:center}
.opt.right{border-color:var(--green);background:#e8f4e9} .opt.right .L{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fbeaea} .opt.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.qrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pbtn{font:700 13.5px/1 var(--display);padding:9px 12px;border-radius:9px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.pbtn:hover{background:var(--ink);color:var(--panel)}
.pbtn.ghost{border-color:var(--line);color:var(--muted)}
.fb{font:700 15px/1.3 var(--display)} .fb.ok{color:var(--green)} .fb.no{color:var(--red)}
.sol{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:8px}
.sol h4{font:800 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sol ol{margin:0;padding-left:22px;display:grid;gap:4px;font-size:15.5px}
.sol li{animation:rise .5s both}
.tip{font-size:14.5px;color:var(--muted);margin:8px 0 0!important}
.tip b{color:var(--red)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* cover */
.cover h1{font:900 64px/0.95 var(--display);font-stretch:72%;text-transform:uppercase;margin:10px 0 14px}
.cover h1 span{color:var(--accent)}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:19px;color:var(--muted);max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 16px;font:600 13.5px/1 var(--display);color:var(--muted)}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.howto{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin:8px 0 16px;font-size:15px}
.howto div{display:flex;gap:10px;align-items:baseline}
kbd{font:700 12px/1 var(--mono);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:3px 6px;background:var(--panel);min-width:24px;text-align:center;display:inline-block}
.toc2{columns:2;font:600 15px/1.9 var(--display);padding-left:0!important;list-style:none}
.toc2 a{color:var(--ink);text-decoration:none;cursor:pointer}
.toc2 a:hover{color:var(--accent)}
.toc2 span{color:var(--accent);display:inline-block;min-width:1.8em}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--bar2);color:var(--bar-ink);font:600 14px var(--display);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){#main{grid-template-columns:minmax(0,1fr)}#bar{flex-wrap:wrap;row-gap:4px}#side{position:fixed;z-index:30;top:var(--barh,53px);bottom:0;left:0;box-shadow:8px 0 24px rgba(0,0,0,.5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="mode-pen">
<div id="bar" role="toolbar" aria-label="Defter araçları">
  <div class="grp">
    <button class="tb" id="b-side" title="Sayfa listesi" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div class="grp" id="tools">
    <button class="tb" data-tool="cursor" title="Etkileşim: deneyleri ve soruları kullan (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg><span class="lbl">Etkileşim</span></button>
    <button class="tb" data-tool="pen" title="Kalem (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg><span class="lbl">Kalem</span></button>
    <button class="tb" data-tool="hl" title="Fosforlu kalem (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-5 5v4h4l5-5"/><path d="M9 11l6-6 4 4-6 6z"/><path d="M15 21h6" stroke="#f5c814" stroke-width="3"/></svg><span class="lbl">Fosforlu</span></button>
    <button class="tb" data-tool="eraser" title="Silgi: dokunduğu çizimi siler (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M5 15l9-9 5 5-8 8H8l-3-3z"/><path d="M10 10l5 5"/></svg><span class="lbl">Silgi</span></button>
    <button class="tb" data-tool="line" title="Düz çizgi (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5"/></svg></button>
    <button class="tb" data-tool="arrow" title="Ok / kuvvet vektörü (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button class="tb" data-tool="rect" title="Dikdörtgen (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button class="tb" data-tool="ellipse" title="Elips / daire (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
    <button class="tb" data-tool="text" title="El yazısı metin (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <button class="tb" data-tool="laser" title="Lazer imleç: iz bırakmaz (K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3" fill="#ff3b30" stroke="#ff3b30"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span class="lbl">Lazer</span></button>
  </div>
  <div class="grp" id="colors"></div>
  <div class="grp">
    <span class="wprev" aria-hidden="true"><i id="wdot"></i></span>
    <label class="vh" for="wrange">Kalınlık</label><input type="range" id="wrange" min="1" max="12" step="1" value="3" title="Kalınlık">
  </div>
  <div class="grp">
    <button class="tb" id="b-undo" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="tb" id="b-redo" title="Yinele (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>

<script>

/* ---------- pages ---------- */
const pages = [];

}

}

}), { root: viewer, rootMargin: '900px 0px' });
let pendingPg = null;
function numberPages() { pages.forEach((p, i) => { p.no.textContent = (i + 1) + ' / ' + pages.length; }); }

  });

}
function removePage(p) {

function currentPage() {

let curShown = null;
function markCurrent() {

  $('#pgi').textContent = (i + 1) + ' / ' + pages.length;

let scrollRaf = 0;
viewer.addEventListener('scroll', () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; markCurrent(); }); }, { passive: true });

/* ---------- ink objects ---------- */

const eraseR = () => 8 + S.width * 2;

  if (o.k === 'rect') { const a = Math.min(o.x0, o.x1), b = Math.max(o.x0, o.x1), t = Math.min(o.y0, o.y1), d = Math.max(o.y0, o.y1); return segDist(p, a, t, b, t) < r || segDist(p, b, t, b, d) < r || segDist(p, b, d, a, d) < r || segDist(p, a, d, a, t) < r; }

const saveT = new Map();
function saveInk(pg) { clearTimeout(saveT.get(pg)); saveT.set(pg, setTimeout(() => LS.set(IKEY + pg.meta.id, pg.objs), 250)); }

/* laser pointer */
const laser = { pg: null, pts: [], raf: 0 };
function drawLaser(c) {

  ta.style.cssText = `left:${p[0] - 5}px;top:${p[1] - size * .95}px;font-size:${size}px;color:${S.color}`;
  ta.rows = 1; pg.page.append(ta); editing = { pg, p, size, ta, color: S.color };

/* pointer handling */

function bindInk(pg) {
  const cv = pg.cv;
  cv.addEventListener('pointerdown', e => {
    if (S.tool === 'cursor') return;
    if (e.pointerType === 'touch') {
      pg.touches.set(e.pointerId, [e.clientX, e.clientY]);
      if (S.finger || pg.touches.size >= 2) { if (pg.cur) { pg.cur = null; render(pg); } pg.erasing = null; pg.pan = midOf(pg.touches); return; }
    }
    if (e.button > 0) return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    S.active = pg; const p = ptOf(pg, e), t = S.tool;
    if (t === 'text') { openText(pg, p); return; }
    if (t === 'laser') { laser.pg = pg; laser.pts.push([p[0], p[1], performance.now()]); if (!laser.raf) laser.raf = requestAnimationFrame(laserTick); pg.lasering = true; return; }
    if (t === 'eraser') { pg.erasing = []; eraseAt(pg, p); return; }
    if (t === 'pen' || t === 'hl') pg.cur = { k: 'stroke', color: S.color, w: t === 'hl' ? 10 + S.width * 3 : S.width, hl: t === 'hl', pts: [p] };
    else pg.cur = { k: t, color: S.color, w: S.width, x0: p[0], y0: p[1], x1: p[0], y1: p[1] };
    pg.cur.pid = e.pointerId; render(pg);
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && pg.touches.has(e.pointerId)) {
      pg.touches.set(e.pointerId, [e.clientX, e.clientY]);
      if (pg.pan) { const m = midOf(pg.touches); viewer.scrollBy(pg.pan[0] - m[0], pg.pan[1] - m[1]); pg.pan = m; return; }
    }
    const p = ptOf(pg, e);
    if (S.tool === 'eraser') { pg.hover = p; if (pg.erasing) eraseAt(pg, p); else render(pg); return; }
    if (pg.lasering && S.tool === 'laser') { laser.pts.push([p[0], p[1], performance.now()]); if (!laser.raf) laser.raf = requestAnimationFrame(laserTick); return; }
    const c = pg.cur; if (!c || c.pid !== e.pointerId) return;
    if (c.k === 'stroke') {
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of evs) { const q = ptOf(pg, ev), l = c.pts[c.pts.length - 1]; if (Math.hypot(q[0] - l[0], q[1] - l[1]) >= 1.2) c.pts.push(q); }
    } else { c.x1 = p[0]; c.y1 = p[1]; if (e.shiftKey && (c.k === 'line' || c.k === 'arrow')) { const a = Math.round(Math.atan2(c.y1 - c.y0, c.x1 - c.x0) / (Math.PI / 12)) * Math.PI / 12, L = Math.hypot(c.x1 - c.x0, c.y1 - c.y0); c.x1 = r1(c.x0 + L * Math.cos(a)); c.y1 = r1(c.y0 + L * Math.sin(a)); } }
    render(pg);
  });
  const up = e => {
    if (e.pointerType === 'touch') { pg.touches.delete(e.pointerId); if (!pg.touches.size) pg.pan = null; else if (pg.pan) pg.pan = midOf(pg.touches); }
    if (pg.lasering) pg.lasering = false;
    if (pg.erasing) { if (pg.erasing.length) commit(pg, { t: 'del', items: pg.erasing }); pg.erasing = null; }
    const c = pg.cur; if (!c || c.pid !== e.pointerId) return; pg.cur = null; delete c.pid;
    const ok = c.k === 'stroke' ? true : Math.hypot(c.x1 - c.x0, c.y1 - c.y0) > 3;
    if (ok) { pg.objs.push(c); commit(pg, { t: 'add', o: c }); }
    render(pg);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (pg.hover) { pg.hover = null; render(pg); } });
}
function eraseAt(pg, p) {
  const R = eraseR(); let any = false;
  for (let i = pg.objs.length - 1; i >= 0; i--) if (hit(pg.objs[i], p, R)) { pg.erasing.push(pg.objs[i]); pg.objs.splice(i, 1); any = true; }
  render(pg);
}
function target() { return S.active && pages.includes(S.active) ? S.active : currentPage(); }
function undo() { const pg = target(); const op = pg && pg.undo.pop(); if (!op) return toast('Geri alınacak çizim yok'); applyOp(pg, op, true); pg.redo.push(op); saveInk(pg); render(pg); }
function redo() { const pg = target(); const op = pg && pg.redo.pop(); if (!op) return; applyOp(pg, op, false); pg.undo.push(op); saveInk(pg); render(pg); }
function applyOp(pg, op, rev) {
  const add = os => pg.objs.push(...os), rem = os => { pg.objs = pg.objs.filter(o => !os.includes(o)); };
  if (op.t === 'add') rev ? rem([op.o]) : add([op.o]);
  else if (op.t === 'del') rev ? add(op.items) : rem(op.items);
  else if (op.t === 'clear') rev ? add(op.items) : rem(op.items);
}

/* ---------- toolbar ---------- */
function setTool(t) {
  if (editing) closeText();
  S.tool = t; document.body.className = document.body.className.replace(/\b(mode|tool)-\S+/g, '').trim();
  document.body.classList.add(t === 'cursor' ? 'mode-cursor' : 'mode-draw', 'tool-' + t);
  document.querySelectorAll('#tools .tb').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t));
  pages.forEach(p => { if (p.hover) { p.hover = null; render(p); } });
}
document.querySelectorAll('#tools .tb').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
const colWrap = $('#colors');
COLORS.forEach(([c, n]) => { const b = document.createElement('button'); b.className = 'sw'; b.style.setProperty('--c', c); b.title = n; b.setAttribute('aria-label', n + ' renk'); b.dataset.c = c; b.addEventListener('click', () => setColor(c)); colWrap.append(b); });
const cp = document.createElement('input'); cp.type = 'color'; cp.id = 'cpick'; cp.title = 'Özel renk'; cp.setAttribute('aria-label', 'Özel renk'); cp.addEventListener('input', () => setColor(cp.value)); colWrap.append(cp);
function setColor(c) { S.color = c; document.querySelectorAll('#colors .sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === c)); if (S.tool === 'eraser' || S.tool === 'cursor' || S.tool === 'laser') setTool('pen'); updW(); }
function updW() { const d = $('#wdot'), z = 3 + S.width * 1.6; d.style.width = d.style.height = z + 'px'; d.style.background = S.color; }
$('#wrange').addEventListener('input', e => { S.width = +e.target.value; updW(); });
$('#b-undo').addEventListener('click', undo); $('#b-redo').addEventListener('click', redo);
let clrT = 0; const bclr = $('#b-clear');
bclr.addEventListener('click', () => {
  if (!bclr.classList.contains('warn')) { bclr.classList.add('warn'); bclr.title = 'Emin misin? Tekrar bas'; toast('Bu sayfadaki çizimleri silmek için tekrar bas'); clearTimeout(clrT); clrT = setTimeout(() => bclr.classList.remove('warn'), 3000); return; }
  bclr.classList.remove('warn'); clearTimeout(clrT); const pg = currentPage(); if (!pg || !pg.objs.length) return;
  const items = pg.objs; pg.objs = []; commit(pg, { t: 'clear', items }); render(pg); toast('Sayfa temizlendi. Geri al ile geri getirebilirsin');
});
function setZoom(z, keep = true) {
  z = clamp(Math.round(z * 100) / 100, .35, 2.5); const p = currentPage();
  const rel = p ? (viewer.scrollTop - p.wrap.offsetTop) / (NBH * S.zoom) : 0, relX = viewer.scrollLeft / Math.max(1, viewer.scrollWidth);
  S.zoom = z; pages.forEach(sizePage); $('#zl').textContent = Math.round(z * 100) + '%';
  if (keep && p) { viewer.scrollTop = p.wrap.offsetTop + rel * NBH * z; viewer.scrollLeft = relX * viewer.scrollWidth; }
}
const fitZoom = () => setZoom((viewer.clientWidth - 40) / NBW);
$('#b-zi').addEventListener('click', () => setZoom(S.zoom + .1)); $('#b-zo').addEventListener('click', () => setZoom(S.zoom - .1)); $('#b-fit').addEventListener('click', fitZoom);
viewer.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setZoom(S.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); } }, { passive: false });
$('#bgsel').addEventListener('change', e => { const p = currentPage(); if (!p) return; p.meta.bg = e.target.value; p.page.className = 'page bg-' + p.meta.bg + (p.meta.type === 'pdf' ? ' pdf' : ''); saveMeta(); });
$('#b-finger').addEventListener('click', e => { S.finger = !S.finger; e.currentTarget.setAttribute('aria-pressed', S.finger); toast(S.finger ? 'Parmak kaydırır, kalem (stylus) çizer' : 'Parmak da çizer; iki parmakla kaydır'); });
$('#b-full').addEventListener('click', toggleFull);
function toggleFull() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => toast('Tam ekran bu görünümde açılamadı')); else document.exitFullscreen(); } catch (e) { toast('Tam ekran bu görünümde açılamadı'); } }
const NARROW = matchMedia('(max-width:1100px)');
function toggleSide(v) { const on = v ?? $('body').classList.contains('noside'); $('body').classList.toggle('noside', !on); $('#b-side').setAttribute('aria-pressed', on); if (!NARROW.matches && window.__ready) fitZoom(); }
const setBarH = () => document.documentElement.style.setProperty('--barh', $('#bar').offsetHeight + 'px');
$('#b-side').addEventListener('click', () => toggleSide());
$('#b-add').addEventListener('click', () => {
  const after = currentPage(), meta = { id: 'B' + Date.now().toString(36), type: 'blank', bg: $('#bgsel').value || 'grid' };
  const pg = makePage(meta, after); pages.splice(pages.indexOf(after) + 1, 0, pg); saveMeta(); buildSide(); goPage(pg); toast('Boş sayfa eklendi');
});
addEventListener('keydown', e => {
  if (e.target.closest('textarea,select,input:not([type=range]):not([type=color])')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { v: 'cursor', p: 'pen', h: 'hl', e: 'eraser', l: 'line', a: 'arrow', r: 'rect', o: 'ellipse', t: 'text', k: 'laser' };
  if (map[k]) { setTool(map[k]); return; }
  if (k === '+' || k === '=') setZoom(S.zoom + .1); else if (k === '-') setZoom(S.zoom - .1); else if (k === '0') fitZoom(); else if (k === 'f') toggleFull();
});

/* ---------- PDF import (pdf.js) ---------- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', PDFW = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('yüklenemedi')); document.head.append(s); });
let pdfReady = null;
function ensurePdf() { if (!pdfReady) pdfReady = loadScript(PDFJS).then(() => loadScript(PDFW)); return pdfReady; }
function idb() { return new Promise((ok, no) => { try { const r = indexedDB.open('defter-tork-v1', 1); r.onupgradeneeded = () => r.result.createObjectStore('pdf'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } }); }
async function idbPut(k, v) { const db = await idb(); return new Promise((ok, no) => { const tx = db.transaction('pdf', 'readwrite'); tx.objectStore('pdf').put(v, k); tx.oncomplete = ok; tx.onerror = () => no(tx.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((ok, no) => { const r = db.transaction('pdf').objectStore('pdf').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
const pdfDocs = {};
async function getDoc(key) {
  if (!pdfDocs[key]) pdfDocs[key] = (async () => { await ensurePdf(); const rec = await idbGet(key); if (!rec) throw new Error('kayıt yok'); return pdfjsLib.getDocument({ data: new Uint8Array(rec.buf.slice(0)) }).promise; })();
  return pdfDocs[key];
}
async function renderPdfPage(pg) {
  if (pg.pdfDone || pg.pdfBusy) return; pg.pdfBusy = true;
  const slot = pg.pc.querySelector('.pdfslot');
  try {
    const doc = await getDoc(pg.meta.key), page = await doc.getPage(pg.meta.n), v1 = page.getViewport({ scale: 1 });
    const fit = Math.min(NBW / v1.width, NBH / v1.height), vp = page.getViewport({ scale: fit * 1.6 });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: x, viewport: vp }).promise;
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .9)); c.width = c.height = 0;
    const img = new Image(); img.alt = pageTitle(pg.meta); img.src = URL.createObjectURL(blob);
    img.style.width = Math.round(v1.width * fit) + 'px'; slot.replaceChildren(img); pg.pdfDone = true;
  } catch (e) { slot.textContent = 'Bu PDF sayfası açılamadı. İnternet bağlantısını kontrol edip PDF\'i yeniden içe aktar.'; }
  pg.pdfBusy = false;
}
$('#b-pdf').addEventListener('click', () => $('#pdfin').click());
$('#pdfin').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('PDF açılıyor…');
  try {
    await ensurePdf(); const buf = await f.arrayBuffer(); const key = 'F' + Date.now().toString(36);
    let stored = true; try { await idbPut(key, { name: f.name, buf }); } catch (x) { stored = false; }
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise; pdfDocs[key] = Promise.resolve(doc);
    const n = Math.min(doc.numPages, 80), name = f.name.replace(/\.pdf$/i, '');
    let after = currentPage(), first = null;
    for (let i = 1; i <= n; i++) { const meta = { id: key + '-' + i, type: 'pdf', key, n: i, name, bg: 'plain' }; const pg = makePage(meta, after); pages.splice(pages.indexOf(after) + 1, 0, pg); after = pg; first = first || pg; }
    saveMeta(); buildSide(); goPage(first);
    toast(n + ' sayfa eklendi' + (doc.numPages > n ? ' (ilk 80 sayfa)' : '') + (stored ? '' : '. Not: bu tarayıcı PDF\'i saklayamadı, sayfa yenilenince kaybolur'));
  } catch (x) { toast('PDF açılamadı: dosya bozuk olabilir ya da pdf.js yüklenemedi'); }
});

/* ---------- build ---------- */
for (const meta of loadMeta()) { pendingPg = null; const pg = makePage(meta); pages.push(pg); }
document.querySelectorAll('#key').forEach(k => { k.innerHTML = Q.map((q, i) => `<div><small>${i + 1}</small>${LET[q.ans]}</div>`).join(''); });
/*@@LABS@@*/
buildSide(); setTool('pen'); setColor('#d62f2f'); updW();
setBarH(); if (NARROW.matches) toggleSide(false);
const startNB = () => {
  drawAll(); fitZoom(); setZoom(Math.min(S.zoom, 1.15), false); viewer.scrollTop = 0; markCurrent(); requestAnimationFrame(loop);
  pages.forEach(p => { if (p.vis) render(p); }); window.__ready = true;
};
(document.fonts && document.fonts.load ? Promise.all(['700 15px Archivo', '900 15px Archivo', '700 20px Caveat'].map(f => document.fonts.load(f))).catch(() => {}) : Promise.resolve()).then(startNB);
addEventListener('resize', () => { setBarH(); if (Math.abs(S.zoom - (viewer.clientWidth - 40) / NBW) > .5) fitZoom(); });
</script>
