<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fizik Defteri: Tork ve Denge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ders kâğıdı (sayfalar her zaman açık renk); kuvvet renkleri anlam taşır */
  --paper:#fffdf8; --panel:#ffffff; --ink:#17212b; --muted:#5a6672; --line:#d3dade; --grid:rgba(60,110,170,.10);
  --accent:#c2410c; --blue:#1f5fae; --green:#2e7d32; --red:#b42318; --soft:#fbf0e7; --tint:#e8eef6;
  /* Uygulama kabuğu koyu: projeksiyonda sayfa öne çıksın. Düzen: üst araç çubuğu, solda sayfa listesi, ortada defter */
  --shell:#11161b; --bar:#1a2128; --bar2:#28323c; --bar-ink:#e8edf2; --bar-mute:#8e9ba7; --hot:#ff7a3d;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--bar-ink);font:400 16px/1.5 var(--body);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:inherit}
/* ---------- toolbar ---------- */
#bar{display:flex;align-items:center;gap:4px;padding:7px 8px;background:var(--bar);border-bottom:1px solid #000;overflow-x:auto;scrollbar-width:thin}
.grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--bar2);flex:none}
.grp:last-child{border-right:0}
.tb{height:38px;min-width:38px;padding:0 8px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--bar-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px/1 var(--display);cursor:pointer;white-space:nowrap;flex:none}
.tb:hover{background:var(--bar2)}
.tb:focus-visible,.sw:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.tb[aria-pressed="true"]{background:var(--hot);color:#1d1209}
.tb svg{width:20px;height:20px;flex:none}
.tb.warn{background:#c4342b;color:#fff}
.tb .lbl{display:none}
@media (min-width:1500px){.tb .lbl{display:inline}}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--bar);box-shadow:0 0 0 1px #4a5560;cursor:pointer;flex:none;background:var(--c);padding:0;margin:0 2px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--hot)}
#cpick{width:28px;height:28px;padding:0;border:0;background:none;cursor:pointer;flex:none}
#wrange{width:84px;accent-color:var(--hot)}
.wprev{width:26px;height:26px;display:grid;place-items:center;flex:none}
.wprev i{display:block;border-radius:50%;background:var(--bar-ink)}
select{height:34px;background:var(--bar2);color:var(--bar-ink);border:1px solid #39444f;border-radius:8px;font:600 13px var(--display);padding:0 6px}
#zl{font:700 13px var(--display);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
#pgi{font:700 13px var(--display);color:var(--bar-mute);padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- layout ---------- */
#main{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0}
#side{width:230px;background:var(--bar);border-right:1px solid #000;overflow-y:auto;padding:10px 8px}
body.noside #side{display:none}
#side h2{font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--bar-mute);margin:6px 8px 10px}
#plist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#plist li{display:flex;align-items:center;gap:2px}
#plist .go{flex:1;display:flex;gap:8px;align-items:baseline;text-align:left;padding:7px 8px;border-radius:8px;border:0;background:transparent;color:var(--bar-ink);font:600 13.5px/1.25 var(--display);cursor:pointer;min-width:0}
#plist .go span{color:var(--bar-mute);font-variant-numeric:tabular-nums;min-width:1.6em}
#plist .go em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plist .go:hover{background:var(--bar2)}
#plist li.cur .go{background:var(--bar2);box-shadow:inset 3px 0 0 var(--hot)}
#plist .del{border:0;background:transparent;color:var(--bar-mute);width:28px;height:28px;border-radius:6px;cursor:pointer;font:700 15px var(--display)}
#plist .del:hover{background:#3a2020;color:#ff8b80}
#plist .del.warn{background:#c4342b;color:#fff;width:auto;padding:0 8px;font-size:12px}
.sidebtns{display:grid;gap:6px;margin-top:12px}
.sidebtns .tb{justify-content:flex-start;background:var(--bar2)}
.sidebtns .tb .lbl{display:inline}
#viewer{overflow:auto;position:relative;padding:22px 0 90px}
.pwrap{margin:0 auto 26px;position:relative}
/* ---------- page ---------- */
.page{position:absolute;top:0;left:0;width:900px;height:1272px;transform-origin:0 0;background-color:var(--paper);color:var(--ink);box-shadow:0 12px 34px rgba(0,0,0,.5);border-radius:4px;overflow:hidden;font:400 17px/1.55 var(--body)}
.page.bg-grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.page.bg-lined{background-image:linear-gradient(transparent 35px,rgba(60,110,170,.24) 36px);background-size:100% 36px;background-position:0 40px}
.page.bg-dots{background-image:radial-gradient(rgba(60,90,130,.38) 1.3px,transparent 1.7px);background-size:24px 24px}
.page::before{content:"";position:absolute;top:0;bottom:0;left:86px;width:2px;background:rgba(214,60,60,.33);z-index:1}
.page::after{content:"";position:absolute;left:24px;top:30px;bottom:30px;width:28px;background:radial-gradient(circle at 14px 14px,var(--shell) 9px,rgba(0,0,0,.18) 10px,transparent 11.5px) 0 0/28px 101px repeat-y;z-index:1}
.page.pdf::before,.page.pdf::after{display:none}
.pc{position:absolute;inset:52px 54px 58px 114px;display:flex;flex-direction:column;gap:0;overflow:hidden;z-index:2}
.page.pdf .pc{inset:0;align-items:center;justify-content:center}
.pdfslot{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font:600 15px var(--display)}
.pdfslot img{max-width:100%;max-height:100%;display:block;box-shadow:0 0 0 1px var(--line)}
.ink{position:absolute;inset:0;width:900px;height:1272px;z-index:5;touch-action:none;cursor:crosshair}
body.mode-cursor .ink{pointer-events:none}
body.tool-text .ink{cursor:text}
body.tool-eraser .ink{cursor:none}
.pno{position:absolute;bottom:20px;right:30px;font:700 12px var(--display);color:var(--muted);z-index:2;letter-spacing:.06em}
.tedit{position:absolute;z-index:8;min-width:140px;min-height:1.3em;background:rgba(255,253,248,.92);border:1.5px dashed var(--accent);border-radius:4px;font-family:var(--hand);font-weight:700;line-height:1.15;padding:0 4px;resize:none;outline:none;overflow:hidden;white-space:pre;color:inherit}
/* ---------- lesson content ---------- */
.pc h1,.pc h2,.pc h3,.pc h4{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.pc p,.pc ul,.pc ol{margin:0 0 12px}
.pc ul{padding-left:22px}
.pc li{margin:3px 0}
.pc a{color:var(--blue)}
.chhead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.chno{font:900 54px/0.9 var(--display);font-stretch:70%;color:var(--accent);font-variant-numeric:tabular-nums}
.pc h2{font-size:36px;font-weight:850;font-stretch:85%}
.pc h3{font-size:21px;font-weight:800;margin:16px 0 8px}
.runhead{font:800 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:1.5px solid var(--line)}
.f{font:500 16px/1.55 var(--mono);background:var(--soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.f b{color:var(--accent)}
.f small{display:block;font-size:13.5px;color:var(--muted);font-family:var(--body);font-style:italic}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px}
.card h4{font-size:16.5px;margin-bottom:6px}
.card.k h4{color:var(--green)} .card.u h4{color:var(--red)} .card.n h4{color:var(--blue)}
.trap{border:1.5px dashed var(--red);border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--panel);font-size:15.5px}
.trap::before{content:"ÖSYM tuzağı";display:block;font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.steps-box{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:7px}
.steps-box li{counter-increment:s;position:relative;padding:9px 12px 9px 48px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;font-size:15.5px;margin:0}
.steps-box li::before{content:counter(s);position:absolute;left:12px;top:8px;width:25px;height:25px;border-radius:50%;background:var(--ink);color:var(--panel);font:800 13px/25px var(--display);text-align:center}
.tbl{border:1.5px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:15.5px;background:var(--panel)}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
figure.lab{margin:8px 0 12px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.labhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;border-bottom:1.5px solid var(--line);font:800 14px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase}
.labhead span{color:var(--accent)}
.live{font:700 11px/1 var(--display);padding:5px 8px;border-radius:99px;background:var(--accent);color:#fff;letter-spacing:.1em}
figure.lab canvas{display:block;width:100%;height:auto;touch-action:none}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;padding:12px 14px;border-top:1.5px solid var(--line)}
.ctrl label{display:flex;justify-content:space-between;font:600 13.5px/1.3 var(--display);margin-bottom:4px}
.ctrl output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.read{padding:10px 14px;border-top:1.5px solid var(--line);font:500 14.5px/1.55 var(--mono);background:var(--soft)}
.read b{color:var(--accent)}
.pill{display:inline-block;font:800 11px/1 var(--display);padding:5px 8px;border-radius:99px;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.pill.ok{background:var(--green);color:#fff} .pill.no{background:var(--red);color:#fff}
figure.lab figcaption{padding:9px 14px;font-size:14.5px;color:var(--muted);border-top:1.5px solid var(--line)}
.notes{flex:1;min-height:80px;margin-top:10px;border:1.5px dashed #b9c3cb;border-radius:10px;font:700 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:#9aa6b0;padding:8px 10px}
.key{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.key div{border:1.5px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;background:var(--panel);font:800 17px/1.2 var(--display)}
.key small{display:block;font:600 11px/1 var(--display);color:var(--muted)}
.fcard{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fcard div{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.fcard b{display:block;font:800 12px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fcard code{font:500 15px/1.5 var(--mono)}
/* questions */
.qcard{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px 16px}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.qn{font:900 26px/1 var(--display);font-stretch:80%}
.qtag{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--line);padding:5px 8px;border-radius:99px}
.qfig{display:block;width:100%;max-width:640px;height:auto;margin:2px auto}
.stem{margin:6px 0 10px!important}
.opts{list-style:none;padding:0!important;margin:0!important;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.opt{width:100%;display:flex;gap:8px;align-items:center;text-align:left;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:500 16px/1.25 var(--body);cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);font:800 13px/23px var(--display);text-align:center}
.opt.right{border-color:var(--green);background:#e8f4e9} .opt.right .L{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fbeaea} .opt.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.qrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pbtn{font:700 13.5px/1 var(--display);padding:9px 12px;border-radius:9px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.pbtn:hover{background:var(--ink);color:var(--panel)}
.pbtn.ghost{border-color:var(--line);color:var(--muted)}
.fb{font:700 15px/1.3 var(--display)} .fb.ok{color:var(--green)} .fb.no{color:var(--red)}
.sol{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:8px}
.sol h4{font:800 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sol ol{margin:0;padding-left:22px;display:grid;gap:4px;font-size:15.5px}
.sol li{animation:rise .5s both}
.tip{font-size:14.5px;color:var(--muted);margin:8px 0 0!important}
.tip b{color:var(--red)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* cover */
.cover h1{font:900 64px/0.95 var(--display);font-stretch:72%;text-transform:uppercase;margin:10px 0 14px}
.cover h1 span{color:var(--accent)}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:19px;color:var(--muted);max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 16px;font:600 13.5px/1 var(--display);color:var(--muted)}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.howto{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin:8px 0 16px;font-size:15px}
.howto div{display:flex;gap:10px;align-items:baseline}
kbd{font:700 12px/1 var(--mono);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:3px 6px;background:var(--panel);min-width:24px;text-align:center;display:inline-block}
.toc2{columns:2;font:600 15px/1.9 var(--display);padding-left:0!important;list-style:none}
.toc2 a{color:var(--ink);text-decoration:none;cursor:pointer}
.toc2 a:hover{color:var(--accent)}
.toc2 span{color:var(--accent);display:inline-block;min-width:1.8em}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--bar2);color:var(--bar-ink);font:600 14px var(--display);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){#side{position:fixed;z-index:30;top:53px;bottom:0;left:0;box-shadow:8px 0 24px rgba(0,0,0,.5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="mode-pen">
<div id="bar" role="toolbar" aria-label="Defter araçları">
  <div class="grp">
    <button class="tb" id="b-side" title="Sayfa listesi" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div class="grp" id="tools">
    <button class="tb" data-tool="cursor" title="Etkileşim: deneyleri ve soruları kullan (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg><span class="lbl">Etkileşim</span></button>
    <button class="tb" data-tool="pen" title="Kalem (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg><span class="lbl">Kalem</span></button>
    <button class="tb" data-tool="hl" title="Fosforlu kalem (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-5 5v4h4l5-5"/><path d="M9 11l6-6 4 4-6 6z"/><path d="M15 21h6" stroke="#f5c814" stroke-width="3"/></svg><span class="lbl">Fosforlu</span></button>
    <button class="tb" data-tool="eraser" title="Silgi: dokunduğu çizimi siler (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M5 15l9-9 5 5-8 8H8l-3-3z"/><path d="M10 10l5 5"/></svg><span class="lbl">Silgi</span></button>
    <button class="tb" data-tool="line" title="Düz çizgi (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5"/></svg></button>
    <button class="tb" data-tool="arrow" title="Ok / kuvvet vektörü (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button class="tb" data-tool="rect" title="Dikdörtgen (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button class="tb" data-tool="ellipse" title="Elips / daire (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
    <button class="tb" data-tool="text" title="El yazısı metin (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <button class="tb" data-tool="laser" title="Lazer imleç: iz bırakmaz (K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3" fill="#ff3b30" stroke="#ff3b30"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span class="lbl">Lazer</span></button>
  </div>
  <div class="grp" id="colors"></div>
  <div class="grp">
    <span class="wprev" aria-hidden="true"><i id="wdot"></i></span>
    <label class="vh" for="wrange">Kalınlık</label><input type="range" id="wrange" min="1" max="12" step="1" value="3" title="Kalınlık">
  </div>
  <div class="grp">
    <button class="tb" id="b-undo" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>

    <button class="tb" id="b-clear" title="Bu sayfadaki çizimleri temizle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="lbl">Sayfayı temizle</span></button>

const LESSON = [{"id": "L-cover", "title": "Kapak ve kullanım", "html": "<div class=\"cover\">\n<div class=\"eyebrow\">AYT Fizik · Etkileşimli ders defteri</div>\n<h1>Tork, Denge <span>&amp;</span> Ağırlık Merkezi</h1>\n<p class=\"lead\">PDF'in tamamı, beş canlı deney ve 16 soru tek defterde. Üstteki araçlarla her sayfanın üzerine yaz, çiz, işaretle; <b>Etkileşim</b> moduna geçip deneyleri ve soruları sınıfa göster.</p>\n<div class=\"legend\"><span><i style=\"background:var(--accent)\"></i>Uygulanan kuvvet F</span><span><i style=\"background:var(--blue)\"></i>İp gerilmesi T</span><span><i style=\"background:var(--green)\"></i>Tepki N, kuvvet kolu</span><span><i style=\"background:var(--red)\"></i>Ağırlık G</span></div>\n<h3>Araçlar</h3>\n<div class=\"howto\">\n<div><kbd>V</kbd>Etkileşim: kaydırıcılar, şıklar, butonlar</div>\n<div><kbd>P</kbd>Kalem</div>\n<div><kbd>H</kbd>Fosforlu kalem</div>\n<div><kbd>E</kbd>Silgi (dokunduğu çizimi siler)</div>\n<div><kbd>L</kbd> <kbd>A</kbd>Düz çizgi, ok (Shift: 15° adım)</div>\n<div><kbd>R</kbd> <kbd>O</kbd>Dikdörtgen, elips</div>\n<div><kbd>T</kbd>El yazısı metin (Enter: bitir)</div>\n<div><kbd>K</kbd>Lazer imleç, iz bırakmaz</div>\n<div><kbd>Ctrl Z</kbd> <kbd>Ctrl Y</kbd>Geri al, yinele</div>\n<div><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd>Yakınlaş, uzaklaş, sığdır</div>\n<div><kbd>F</kbd>Tam ekran</div>\n<div>✋ İki parmakla sayfayı kaydır</div>\n</div>\n<p style=\"font-size:15px;color:var(--muted)\">Çizimler bu cihazda otomatik kaydedilir. Soldaki listeden boş sayfa (kareli, çizgili, noktalı, düz) ekleyebilir ya da başka bir PDF'i içe aktarıp onun üzerine de yazabilirsin.</p>\n<h3>İçindekiler</h3>\n<ul class=\"toc2\">\n<li><a data-goto=\"L-tork\"><span>1</span>Tork nedir?</a></li>\n<li><a data-goto=\"L-lab1\"><span>·</span>Deney: kuvvet kolu</a></li>\n<li><a data-goto=\"L-bileske\"><span>2</span>Bileşke tork</a></li>\n<li><a data-goto=\"L-denge1\"><span>3</span>Denge şartları</a></li>\n<li><a data-goto=\"L-lab2\"><span>·</span>Deney: tahterevalli</a></li>\n<li><a data-goto=\"L-km1\"><span>4</span>Kütle merkezi</a></li>\n<li><a data-goto=\"L-lab3\"><span>·</span>Deney: KM'yi bul</a></li>\n<li><a data-goto=\"L-kesme\"><span>5</span>Kesme ve ekleme</a></li>\n<li><a data-goto=\"L-tur\"><span>6</span>Denge türleri</a></li>\n<li><a data-goto=\"L-lab4\"><span>·</span>Deney: devrilme</a></li>\n<li><a data-goto=\"L-strateji\"><span>7</span>Çözüm stratejisi</a></li>\n<li><a data-goto=\"L-q1\"><span>8</span>16 soru</a></li>\n<li><a data-goto=\"L-anahtar\"><span>9</span>Cevap anahtarı</a></li>\n</ul>\n</div>", "bg": "plain"}, {"id": "L-tork", "title": "1 · Tork nedir?", "html": "<div class=\"chhead\"><div class=\"chno\">01</div><h2>Tork nedir?</h2></div>\n  <p>Bir kapıyı menteşeye yakın yerinden itmek zordur, kolundan itmek kolaydır. Kuvvet aynı olsa bile <b>döndürme etkisi</b> farklıdır. Kuvvetin bir cismi bir nokta ya da eksen etrafında döndürme etkisine <b>tork</b> (moment) denir ve τ (tau) ile gösterilir.</p>\n  <div class=\"f\"><b>τ = F · d⊥</b><small>d⊥ (kuvvet kolu): dönme noktasından kuvvetin etki çizgisine olan dik uzaklık</small></div>\n  <div class=\"f\"><b>τ = F · r · sin θ</b><small>r: dönme noktasından kuvvetin uygulandığı noktaya uzaklık · θ: r ile F arasındaki açı</small></div>\n  <ul>\n    <li><b>Birim:</b> N·m. Tork vektörel bir büyüklüktür; yönü sağ el kuralıyla bulunur. Dört parmak dönme yönünde kıvrılınca baş parmak torkun yönünü gösterir.</li>\n    <li><b>İşaret:</b> Düzlem sorularında bir yön seç. Bu kitapta saat yönünün tersi (+), saat yönü (−) alınmıştır.</li>\n    <li><b>Tork sıfır olur:</b> kuvvetin etki çizgisi dönme noktasından geçiyorsa (d⊥ = 0) ya da kuvvet, r doğrultusuna paralelse (θ = 0° veya 180°).</li>\n    <li><b>Yalnızca dik bileşen döndürür.</b> Eğik kuvveti çubuğa dik (F·sin θ) ve paralel (F·cos θ) bileşenlere ayır; paralel bileşen dönme noktasından geçer.</li>\n  </ul>", "bg": "grid"}, {"id": "L-lab1", "title": "Deney 1 · Kuvvet kolu", "html": "<div class=\"runhead\">01 · Tork</div><figure class=\"lab\" id=\"lab1\">\n    <div class=\"labhead\"><div>Deney 1 · <span>Kuvvet kolu</span></div><b class=\"live\">Canlı</b></div>\n    <canvas data-w=\"640\" data-h=\"330\" role=\"img\" aria-label=\"Menteşeli çubuk, uygulanan kuvvet ve kuvvet kolu\"></canvas>\n    <div class=\"ctrl\">\n      <div><label for=\"l1F\">Kuvvet F <output id=\"o-l1F\"></output></label><input type=\"range\" id=\"l1F\" min=\"5\" max=\"50\" step=\"5\" value=\"30\"></div>\n      <div><label for=\"l1d\">Uzaklık r <output id=\"o-l1d\"></output></label><input type=\"range\" id=\"l1d\" min=\"0.5\" max=\"4\" step=\"0.5\" value=\"3\"></div>\n      <div><label for=\"l1t\">Açı θ <output id=\"o-l1t\"></output></label><input type=\"range\" id=\"l1t\" min=\"0\" max=\"360\" step=\"5\" value=\"120\"></div>\n    </div>\n    <div class=\"read\" id=\"r1\"></div>\n    <figcaption>Açıyı 0° ya da 180° yap: kuvvet çubuk boyunca uzanır, kuvvet kolu sıfırlanır ve çubuk dönmez. 90°'de tork en büyüktür.</figcaption>\n  </figure><div class=\"trap\">N·m tork birimidir; iş birimi joule (J) ile aynı yazılır ama aynı büyüklük değildir. İş skaler, tork vektördür. Şıklarda “J” görürsen tork sorusunda dikkat et.</div><div class=\"notes\">Not alanı</div>", "bg": "grid"}, {"id": "L-bileske", "title": "2 · Bileşke tork, kuvvet çifti", "html": "<div class=\"chhead\"><div class=\"chno\">02</div><h2>Bileşke tork ve kuvvet çifti</h2></div>\n  <p>Bir cisme birden çok kuvvet etki ediyorsa toplam döndürme etkisi, torkların <b>işaretli</b> toplamıdır. Önce her kuvvetin kuvvet kolunu bul, sonra yönüne göre + ya da − yaz.</p>\n  <div class=\"f\"><b>Στ = τ₁ + τ₂ + τ₃ + …</b><small>Saat yönünün tersi (+), saat yönü (−)</small></div>\n  <h3>Kuvvet çifti</h3>\n  <p>Büyüklükleri eşit, yönleri zıt ve etki çizgileri farklı iki kuvvete <b>kuvvet çifti</b> denir. Bileşke kuvvet sıfırdır, bu yüzden cisim ötelenmez; ama döner. Direksiyon çevirmek ve musluk açmak kuvvet çiftine örnektir.</p>\n  <div class=\"f\"><b>τ_çift = F · d</b><small>d: iki etki çizgisi arasındaki dik uzaklık. Çiftin torku hangi noktaya göre alınırsa alınsın aynıdır.</small></div>\n  <div class=\"trap\">“Net kuvvet sıfır, öyleyse cisim dengededir” yanlış bir çıkarımdır. Kuvvet çifti etkisindeki cisimde net kuvvet sıfırdır ama net tork sıfır değildir; cisim dönmeye başlar. Tersine, net torku sıfır olan bir cisim de ötelenerek hızlanabilir.</div><div class=\"notes\">Not alanı</div>", "bg": "grid"}, {"id": "L-denge1", "title": "3 · Denge şartları", "html": "<div class=\"chhead\"><div class=\"chno\">03</div><h2>Denge şartları</h2></div>\n  <p>Bir cismin durgun kalması (statik denge) için <b>iki şartın birlikte</b> sağlanması gerekir.</p>\n  <div class=\"cards\">\n    <div class=\"card\"><h4>1 · Öteleme dengesi</h4><span style=\"font-family:var(--mono)\">ΣF = 0</span><br>ΣF<sub>x</sub> = 0 ve ΣF<sub>y</sub> = 0. Cisim kaymaz, düşmez, yükselmez.</div>\n    <div class=\"card\"><h4>2 · Dönme dengesi</h4><span style=\"font-family:var(--mono)\">Στ = 0</span><br>Dengedeki cisimde bu eşitlik <b>her noktaya göre</b> sağlanır. Noktayı sen seçersin.</div>\n  </div>\n  <h3>Hangi kuvvet nereye, hangi yöne?</h3>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>Kuvvet</th><th>Etki noktası ve yönü</th></tr></thead>\n    <tbody>\n      <tr><td>Ağırlık G = m·g</td><td>Ağırlık merkezinden, düşey aşağı. Türdeş çubukta orta nokta.</td></tr>\n      <tr><td>İp gerilmesi T</td><td>İp boyunca, cismi ipe doğru <b>çeker</b>. Asla itmez.</td></tr>\n      <tr><td>Destek tepkisi N</td><td>Temas yüzeyine dik, cismi <b>iter</b>. Sürtünmesiz duvarda yatay.</td></tr>\n      <tr><td>Menteşe kuvveti</td><td>Yönü bilinmez; iki bileşenle (yatay + düşey) yazılır.</td></tr>\n      <tr><td>Sürtünme f<sub>s</sub></td><td>Yüzeye paralel, kaymaya çalışılan yönün tersine.</td></tr>\n    </tbody>\n  </table></div>", "bg": "grid"}, {"id": "L-lab2", "title": "Deney 2 · Tahterevalli", "html": "<div class=\"runhead\">03 · Denge şartları</div><figure class=\"lab\" id=\"lab2\">\n    <div class=\"labhead\"><div>Deney 2 · <span>Tahterevalli</span></div><b class=\"live\">Canlı</b></div>\n    <canvas data-w=\"640\" data-h=\"320\" role=\"img\" aria-label=\"Ortasından desteklenen tahterevalli ve iki kütle\"></canvas>\n    <div class=\"ctrl\">\n      <div><label for=\"l2m1\">Sol kütle m₁ <output id=\"o-l2m1\"></output></label><input type=\"range\" id=\"l2m1\" min=\"10\" max=\"80\" step=\"5\" value=\"40\"></div>\n      <div><label for=\"l2d1\">Sol uzaklık d₁ <output id=\"o-l2d1\"></output></label><input type=\"range\" id=\"l2d1\" min=\"0.5\" max=\"3\" step=\"0.25\" value=\"3\"></div>\n      <div><label for=\"l2m2\">Sağ kütle m₂ <output id=\"o-l2m2\"></output></label><input type=\"range\" id=\"l2m2\" min=\"10\" max=\"80\" step=\"5\" value=\"60\"></div>\n      <div><label for=\"l2d2\">Sağ uzaklık d₂ <output id=\"o-l2d2\"></output></label><input type=\"range\" id=\"l2d2\" min=\"0.5\" max=\"3\" step=\"0.25\" value=\"2.5\"></div>\n    </div>\n    <div class=\"read\" id=\"r2\"></div>\n    <figcaption>Sağ kütleyi 2 m'ye çek: 40·3 = 60·2 olur ve tahta yatay dengeye gelir. Ağır olan, desteğe yakın oturur.</figcaption>\n  </figure><div class=\"notes\">Not alanı</div>", "bg": "grid"}, {"id": "L-denge2", "title": "3 · Denge: 5 adım, Lami", "html": "<div class=\"runhead\">03 · Denge şartları</div><h3>Denge sorusu beş adımda çözülür</h3>\n  <ol class=\"steps-box\">\n    <li><b>Serbest cisim diyagramı</b> çiz: ağırlık, ipler, destekler, menteşe. Çubuğun kendi ağırlığını unutma.</li>\n    <li><b>Dönme noktasını</b> en çok bilinmeyen kuvvetin geçtiği noktada seç. O kuvvetlerin torku sıfır olur ve denklemden düşer.</li>\n    <li><b>Tork denklemini</b> yaz: saat yönündeki torkların toplamı = saat yönünün tersindeki torkların toplamı.</li>\n    <li>Kalan bilinmeyenleri <b>ΣF = 0</b>'dan bul (düşeyde yukarı = aşağı).</li>\n    <li><b>Kontrol et:</b> ip gerilmesi ve tepki kuvveti negatif çıkamaz. Yük hangi desteğe yakınsa o destek daha fazla taşır.</li>\n  </ol>\n  <h3>Üç kuvvet kuralı ve Lami teoremi</h3>\n  <p>Yalnızca üç kuvvetin etkisinde dengede olan bir cisimde kuvvetlerin etki çizgileri ya <b>tek bir noktada kesişir</b> ya da birbirine <b>paraleldir</b>. Kesişiyorlarsa her kuvvet, diğer iki kuvvet arasındaki açının sinüsüyle orantılıdır:</p>\n  <div class=\"f\"><b>F₁ / sin α₁ = F₂ / sin α₂ = F₃ / sin α₃</b><small>α₁: F₂ ile F₃ arasındaki açı (diğerleri de benzer şekilde)</small></div>\n  <div class=\"trap\">Hesap sonunda bir ip gerilmesi negatif ya da sıfır çıkarsa o ip <b>gevşektir</b>. ÖSYM bu durumu “hangi ipteki gerilme sıfırdır?” şeklinde sorar. Soru 6'da bunu göreceksin.</div>", "bg": "grid"}, {"id": "L-km1", "title": "4 · Kütle ve ağırlık merkezi", "html": "<div class=\"chhead\"><div class=\"chno\">04</div><h2>Kütle merkezi ve ağırlık merkezi</h2></div>\n  <p><b>Kütle merkezi</b>, cismin bütün kütlesinin toplandığı kabul edilebilecek noktadır. <b>Ağırlık merkezi</b> ise cismin ağırlığının etki ettiği noktadır. Yer çekimi ivmesi cismin her yerinde aynıysa (günlük boyuttaki cisimler) bu iki nokta çakışır.</p>\n  <div class=\"f\"><b>x_KM = (m₁x₁ + m₂x₂ + …) / (m₁ + m₂ + …)</b><br><b>y_KM = (m₁y₁ + m₂y₂ + …) / (m₁ + m₂ + …)</b><small>Kütle yerine ağırlık, tel için uzunluk, levha için alan, katı için hacim de kullanılabilir (türdeşse).</small></div>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>Türdeş cisim</th><th>Ağırlık merkezi</th></tr></thead>\n    <tbody>\n      <tr><td>Düzgün çubuk</td><td>Orta noktası</td></tr>\n      <tr><td>Kare, dikdörtgen levha</td><td>Köşegenlerin kesim noktası</td></tr>\n      <tr><td>Daire levha, küre</td><td>Merkez</td></tr>\n      <tr><td>Halka, çember</td><td>Merkez: <b>cismin dışında</b> bir nokta</td></tr>\n      <tr><td>Üçgen levha</td><td>Kenarortayların kesişimi; tabandan h/3 yukarıda</td></tr>\n      <tr><td>Bükülmüş tel</td><td>Her parçanın orta noktası, uzunluğuyla ağırlıklandırılır</td></tr>\n    </tbody>\n  </table></div>\n  <h3>Asma kuralı</h3>\n  <p>Bir noktasından serbestçe asılan cisim, ağırlık merkezi asma noktasının <b>tam düşeyine</b> gelecek şekilde durur. Cismi iki farklı noktasından asıp her seferinde çekül doğrultusunu çizersen, iki çizginin kesiştiği nokta ağırlık merkezidir. Tek ipe asılan bir çubuğun yatay kalması için ip, ağırlık merkezine bağlanmalıdır.</p>", "bg": "grid"}, {"id": "L-lab3", "title": "Deney 3 · KM'yi bul", "html": "<div class=\"runhead\">04 · Kütle merkezi</div><figure class=\"lab\" id=\"lab3\">\n    <div class=\"labhead\"><div>Deney 3 · <span>Kütle merkezini bul</span></div><b class=\"live\">Canlı</b></div>\n    <canvas data-w=\"640\" data-h=\"290\" role=\"img\" aria-label=\"Ağırlıksız çubuk üzerinde üç kütle ve kütle merkezi\"></canvas>\n    <div class=\"ctrl\">\n      <div><label for=\"l3m0\">m₁ <output id=\"o-l3m0\"></output></label><input type=\"range\" id=\"l3m0\" min=\"1\" max=\"10\" step=\"1\" value=\"3\"></div>\n      <div><label for=\"l3m1\">m₂ <output id=\"o-l3m1\"></output></label><input type=\"range\" id=\"l3m1\" min=\"1\" max=\"10\" step=\"1\" value=\"5\"></div>\n      <div><label for=\"l3m2\">m₃ <output id=\"o-l3m2\"></output></label><input type=\"range\" id=\"l3m2\" min=\"1\" max=\"10\" step=\"1\" value=\"2\"></div>\n      <div><label for=\"l3x0\">x₁ <output id=\"o-l3x0\"></output></label><input type=\"range\" id=\"l3x0\" min=\"0\" max=\"8\" step=\"0.5\" value=\"1\"></div>\n      <div><label for=\"l3x1\">x₂ <output id=\"o-l3x1\"></output></label><input type=\"range\" id=\"l3x1\" min=\"0\" max=\"8\" step=\"0.5\" value=\"4\"></div>\n      <div><label for=\"l3x2\">x₃ <output id=\"o-l3x2\"></output></label><input type=\"range\" id=\"l3x2\" min=\"0\" max=\"8\" step=\"0.5\" value=\"7\"></div>\n    </div>\n    <div class=\"read\" id=\"r3\"></div>\n    <figcaption>Kütleleri sürükleyebilirsin. Destek kendiliğinden kütle merkezine kayar; çubuk o noktadan desteklenince dengede kalır.</figcaption>\n  </figure><div class=\"trap\">Tel sorusunda alan, levha sorusunda uzunluk kullanma. Telde kütle <b>uzunlukla</b>, levhada <b>alanla</b>, katıda <b>hacimle</b> orantılıdır. Kütle merkezi her zaman cismin üzerinde olmak zorunda değildir (halka, L biçimli tel).</div><div class=\"notes\">Not alanı</div>", "bg": "grid"}, {"id": "L-kesme", "title": "5 · Kesme, ekleme, katlama", "html": "<div class=\"chhead\"><div class=\"chno\">05</div><h2>Kesme, ekleme ve katlama</h2></div>\n  <p>Delikli ya da bir parçası kesilmiş levhalarda, kesilen parçayı <b>negatif kütle</b> gibi düşün: önce bütün cismi hesaba kat, sonra kesilen parçayı çıkar.</p>\n  <div class=\"f\"><b>x_kalan = (M·X − m·x) / (M − m)</b><small>M, X: bütün cismin kütlesi (alanı) ve KM'si · m, x: kesilen parçanınki</small></div>\n  <ul>\n    <li>Bütünün, kesilen parçanın ve kalan parçanın kütle merkezleri <b>aynı doğru üzerindedir</b>.</li>\n    <li>Kalan parçanın KM'si, kesilen parçanın <b>ters yönüne</b> kayar.</li>\n    <li><b>Ekleme:</b> eklenen parça (+) işaretle aynı formüle girer.</li>\n    <li><b>Katlama:</b> toplam kütle değişmez; yalnızca katlanan parçanın KM'si yeni yerine taşınır.</li>\n  </ul>\n  <figure class=\"lab\" id=\"lab5\">\n    <div class=\"labhead\"><div>Deney 4 · <span>Köşeden kare kes</span></div><b class=\"live\">Canlı</b></div>\n    <canvas data-w=\"600\" data-h=\"320\" role=\"img\" aria-label=\"Köşesinden kare kesilmiş kare levha ve kütle merkezleri\"></canvas>\n    <div class=\"ctrl\">\n      <div><label for=\"l5s\">Kesilen karenin kenarı <output id=\"o-l5s\"></output></label><input type=\"range\" id=\"l5s\" min=\"0\" max=\"3\" step=\"0.25\" value=\"2\"></div>\n    </div>\n    <div class=\"read\" id=\"r5\"></div>\n    <figcaption>Üç nokta hep aynı kesik çizgi üzerinde kalır. Kesilen parça büyüdükçe kalanın KM'si sol alt köşeye doğru kaçar.</figcaption>\n  </figure>", "bg": "grid"}, {"id": "L-tur", "title": "6 · Denge türleri, devrilme", "html": "<div class=\"chhead\"><div class=\"chno\">06</div><h2>Denge türleri ve devrilme</h2></div>\n  <div class=\"cards\">\n    <div class=\"card k\"><h4>Kararlı denge</h4>Hafifçe itilince ağırlık merkezi <b>yükselir</b>; cisim eski konumuna döner. Çukurun dibindeki bilye.</div>\n    <div class=\"card u\"><h4>Kararsız denge</h4>Hafifçe itilince ağırlık merkezi <b>alçalır</b>; cisim konumundan uzaklaşır. Tepedeki bilye, ucu üzerinde duran kalem.</div>\n    <div class=\"card n\"><h4>Nötr denge</h4>Ağırlık merkezinin yüksekliği <b>değişmez</b>; cisim yeni konumunda kalır. Düz zemindeki bilye, yan yatmış silindir.</div>\n  </div>\n  <h3>Devrilme kuralı</h3>\n  <p>Ağırlık merkezinden geçen düşey doğru <b>taban alanının içinde</b> kaldıkça cisim devrilmez. Bu doğru tabanın dışına çıktığı anda ağırlık, dönme kenarına göre devirici bir tork üretir. Ağırlık merkezi alçak ve tabanı geniş cisimler daha kararlıdır.</p>\n  <div class=\"f\"><b>tan θ_c = b / h</b><small>Eğik düzlemde türdeş blok için kritik açı (b: taban genişliği, h: yükseklik; kaymadığı varsayılır)</small></div><div class=\"notes\">Not alanı</div>", "bg": "grid"}, {"id": "L-lab4", "title": "Deney 5 · Devrilme", "html": "<div class=\"runhead\">06 · Devrilme</div><figure class=\"lab\" id=\"lab4\">\n    <div class=\"labhead\"><div>Deney 5 · <span>Ne zaman devrilir?</span></div><b class=\"live\">Canlı</b></div>\n    <canvas data-w=\"640\" data-h=\"340\" role=\"img\" aria-label=\"Eğilen bir zemin üzerindeki dikdörtgen blok\"></canvas>\n    <div class=\"ctrl\">\n      <div><label for=\"l4b\">Taban b <output id=\"o-l4b\"></output></label><input type=\"range\" id=\"l4b\" min=\"0.4\" max=\"1.6\" step=\"0.1\" value=\"0.8\"></div>\n      <div><label for=\"l4h\">Yükseklik h <output id=\"o-l4h\"></output></label><input type=\"range\" id=\"l4h\" min=\"0.6\" max=\"2\" step=\"0.1\" value=\"1.6\"></div>\n      <div><label for=\"l4a\">Eğim α <output id=\"o-l4a\"></output></label><input type=\"range\" id=\"l4a\" min=\"0\" max=\"50\" step=\"1\" value=\"20\"></div>\n    </div>\n    <div class=\"read\" id=\"r4\"></div>\n    <figcaption>Eğimi yavaşça artır. Kesik düşey çizgi dönme kenarının soluna geçtiği anda blok devrilir.</figcaption>\n  </figure><div class=\"notes\">Not alanı</div>", "bg": "grid"}, {"id": "L-strateji", "title": "7 · Çözüm stratejisi", "html": "<div class=\"chhead\"><div class=\"chno\">07</div><h2>Çözüm stratejisi ve sık yapılan hatalar</h2></div>\n  <ol class=\"steps-box\">\n    <li><b>Çubuğun ağırlığını unutma.</b> Türdeş çubuğun ağırlığı orta noktasına etki eder. “Ağırlığı önemsiz” yazmıyorsa vardır.</li>\n    <li><b>Kuvvet kolu dik uzaklıktır.</b> Eğik ip ya da kuvvette sin θ ile çarp ya da kuvveti bileşenlerine ayır.</li>\n    <li><b>Bilinmeyenin geçtiği noktaya göre tork al.</b> Menteşe, destek ve zemin tepkisi bu yolla denklemden düşer.</li>\n    <li><b>İp çeker, destek iter.</b> Negatif sonuç, ipin gevşediğini ya da cismin desteklerden kalktığını gösterir.</li>\n    <li><b>Simetriyi kullan.</b> Simetrik yüklemede tepkiler ve gerilmeler eşittir.</li>\n    <li><b>Oran sorularında g sadeleşir.</b> Sayısal sorularda g = 10 m/s² al.</li>\n    <li><b>Açılar:</b> sin 30° = 0,5 · sin 37° = 0,6 · sin 53° = 0,8 · sin 45° = √2/2 · sin 60° = √3/2. (cos α = sin(90° − α))</li>\n    <li><b>Sonucu mantıkla kontrol et.</b> KM ağır tarafa yakındır. Yük hangi desteğe yakınsa o destek daha çok taşır.</li>\n  </ol><div class=\"notes\">Not alanı</div>", "bg": "grid"}, {"id": "L-q1", "title": "Soru 1", "html": qHTML(0), "bg": "grid"}, {"id": "L-q2", "title": "Soru 2", "html": qHTML(1), "bg": "grid"}, {"id": "L-q3", "title": "Soru 3", "html": qHTML(2), "bg": "grid"}, {"id": "L-q4", "title": "Soru 4", "html": qHTML(3), "bg": "grid"}, {"id": "L-q5", "title": "Soru 5", "html": qHTML(4), "bg": "grid"}, {"id": "L-q6", "title": "Soru 6", "html": qHTML(5), "bg": "grid"}, {"id": "L-q7", "title": "Soru 7", "html": qHTML(6), "bg": "grid"}, {"id": "L-q8", "title": "Soru 8", "html": qHTML(7), "bg": "grid"}, {"id": "L-q9", "title": "Soru 9", "html": qHTML(8), "bg": "grid"}, {"id": "L-q10", "title": "Soru 10", "html": qHTML(9), "bg": "grid"}, {"id": "L-q11", "title": "Soru 11", "html": qHTML(10), "bg": "grid"}, {"id": "L-q12", "title": "Soru 12", "html": qHTML(11), "bg": "grid"}, {"id": "L-q13", "title": "Soru 13", "html": qHTML(12), "bg": "grid"}, {"id": "L-q14", "title": "Soru 14", "html": qHTML(13), "bg": "grid"}, {"id": "L-q15", "title": "Soru 15", "html": qHTML(14), "bg": "grid"}, {"id": "L-q16", "title": "Soru 16", "html": qHTML(15), "bg": "grid"}, {"id": "L-anahtar", "title": "9 · Cevap anahtarı, formül kartı", "html": "<div class=\"chhead\"><div class=\"chno\">09</div><h2>Cevap anahtarı ve formül kartı</h2></div>\n  <div class=\"key\" id=\"key\"></div>\n  <h3>Formül kartı</h3>\n  <div class=\"fcard\">\n    <div><b>Tork</b><code>τ = F·d⊥ = F·r·sin θ</code></div>\n    <div><b>Bileşke tork</b><code>Στ = Σ(±F·d⊥)</code></div>\n    <div><b>Kuvvet çifti</b><code>τ = F·d (her noktaya göre)</code></div>\n    <div><b>Denge</b><code>ΣF = 0 ve Στ = 0</code></div>\n    <div><b>Lami</b><code>F₁/sin α₁ = F₂/sin α₂ = F₃/sin α₃</code></div>\n    <div><b>Kütle merkezi</b><code>x = Σmx / Σm</code></div>\n    <div><b>Kesme</b><code>x = (MX − mx)/(M − m)</code></div>\n    <div><b>Devrilme açısı</b><code>tan θ_c = b/h</code></div>\n  </div><div class=\"notes\">Not alanı</div>", "bg": "grid"}];
const NBW = 900, NBH = 1272;
const viewer = $('#viewer');
const S = { tool: 'pen', color: '#d62f2f', width: 3, finger: false, zoom: 1, active: null, cur: null };
const COLORS = [['#17212b', 'Siyah'], ['#d62f2f', 'Kırmızı'], ['#1f5fae', 'Mavi'], ['#2e8b3e', 'Yeşil'], ['#e07b00', 'Turuncu'], ['#7b3fbf', 'Mor']];
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Tarayıcı depolaması dolu: son çizim kaydedilemedi'); } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const PKEY = 'defter-tork-v1-pages', IKEY = 'defter-tork-v1-ink-';
let toastT = 0;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- questions inside pages ---------- */
const qState = Q.map(() => ({ s: 0 }));
function drawQ(i) { const cv = document.querySelector('#s' + (i + 1) + ' canvas'); if (!cv) return; Q[i].fig(ctxOf(cv), qState[i].s); }
function animateSol(i) {
  if (RM) { qState[i].s = 1; drawQ(i); return; }
  const t0 = performance.now(), dur = 2600;
  const step = now => { qState[i].s = clamp((now - t0) / dur, 0, 1); drawQ(i); if (qState[i].s < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function qHTML(i) {
  const q = Q[i], n = i + 1;
  return `<div class="qcard" id="s${n}"><div class="qh"><span class="qn">Soru ${n}</span><span class="qtag">${q.tag}</span></div>
  <canvas class="qfig" data-w="560" data-h="300" role="img" aria-label="Soru ${n} şekli"></canvas>
  <p class="stem">${q.stem}</p>
  <ol class="opts">${q.opts.map((o, j) => `<li><button type="button" class="opt" data-q="${i}" data-j="${j}"><span class="L">${LET[j]}</span><span>${o}</span></button></li>`).join('')}</ol>
  <div class="qrow"><button type="button" class="pbtn showsol" data-q="${i}">Çözümü göster</button><button type="button" class="pbtn ghost qreset" data-q="${i}">Sıfırla</button><span class="fb"></span></div>
  <div class="sol" hidden></div></div><div class="notes">Not alanı</div>`;
}
function openSol(i) {
  const el = $('#s' + (i + 1)), sol = el.querySelector('.sol');
  const q = Q[i];
  sol.innerHTML = `<h4>Çözüm</h4><ol>${q.sol.map((x, k) => `<li style="animation-delay:${k * .55}s">${x}</li>`).join('')}</ol>${q.tip ? `<p class="tip"><b>Tuzak:</b> ${q.tip}</p>` : ''}`;
  sol.hidden = false; el.querySelector('.showsol').textContent = 'Animasyonu tekrar oynat'; animateSol(i);
}
function choose(i, j) {
  const el = $('#s' + (i + 1)); if (el.dataset.locked) return; el.dataset.locked = '1';
  const ok = j === Q[i].ans;
  el.querySelectorAll('.opt').forEach(b => { const k = +b.dataset.j; b.disabled = true; if (k === Q[i].ans) b.classList.add('right'); else if (k === j) b.classList.add('wrong'); });
  const fb = el.querySelector('.fb'); fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.textContent = ok ? 'Doğru!' : 'Doğru cevap ' + LET[Q[i].ans];
  openSol(i);
}
function resetQ(i) {
  const el = $('#s' + (i + 1)); delete el.dataset.locked;
  el.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('right', 'wrong'); });
  el.querySelector('.fb').textContent = ''; el.querySelector('.sol').hidden = true; el.querySelector('.showsol').textContent = 'Çözümü göster';
  qState[i].s = 0; drawQ(i);
}
viewer.addEventListener('click', e => {
  const o = e.target.closest('.opt'); if (o) return choose(+o.dataset.q, +o.dataset.j);
  const s = e.target.closest('.showsol'); if (s) return openSol(+s.dataset.q);
  const r = e.target.closest('.qreset'); if (r) return resetQ(+r.dataset.q);
  const g = e.target.closest('[data-goto]'); if (g) { e.preventDefault(); const pg = pages.find(p => p.meta.id === g.dataset.goto); if (pg) goPage(pg); }
});

/* ---------- pages ---------- */
const pages = [];
function defaultMeta() { return [...LESSON.map(l => ({ id: l.id, type: 'lesson', bg: l.bg || 'grid' })), { id: 'B1', type: 'blank', bg: 'grid' }, { id: 'B2', type: 'blank', bg: 'lined' }]; }
function loadMeta() {
  let m = LS.get(PKEY, null); if (!Array.isArray(m) || !m.length) return defaultMeta();
  const ids = new Set(LESSON.map(l => l.id));
  m = m.filter(x => x && x.id && (x.type !== 'lesson' || ids.has(x.id)));
  for (const l of LESSON) if (!m.some(x => x.id === l.id)) m.push({ id: l.id, type: 'lesson', bg: l.bg || 'grid' });
  return m;
}
const saveMeta = () => LS.set(PKEY, pages.map(p => p.meta));
function pageTitle(meta) {
  if (meta.type === 'lesson') return (LESSON.find(l => l.id === meta.id) || {}).title || 'Ders';
  if (meta.type === 'pdf') return (meta.name || 'PDF') + ' · s.' + meta.n;
  return 'Boş sayfa';
}
function makePage(meta, after) {
  const wrap = document.createElement('div'); wrap.className = 'pwrap'; wrap.dataset.id = meta.id;
  const page = document.createElement('div'); page.className = 'page bg-' + (meta.bg || 'grid') + (meta.type === 'pdf' ? ' pdf' : '');
  const pc = document.createElement('div'); pc.className = 'pc';

    T(c, 'd⊥ = ' + fmt(d * Math.abs(sn), 2) + ' m', (hx + fx) / 2 + (fy < y ? -10 : 10) * 1, (y + fy) / 2 + (fy < y ? -14 : 14), { col: P.green, size: 14, w: 800, bg: true });
  }
  c.save(); c.strokeStyle = P.muted; c.lineWidth = 1.4; c.beginPath(); c.arc(px, y, 30, 0, -th, true); c.stroke(); c.restore();

    c.fillStyle = P.accent; c.beginPath(); c.moveTo(hx2 + tx * 10, hy2 + ty * 10); c.lineTo(hx2 - ty * 6, hy2 + tx * 6); c.lineTo(hx2 + ty * 6, hy2 - tx * 6); c.closePath(); c.fill(); c.restore();

  $('#r1').innerHTML = `τ = F · r · sin θ = ${F} · ${fmt(d, 1)} · ${fmt(Math.abs(sn), 2)} = <b>${fmt(Math.abs(tau), 1)} N·m</b> · ${Math.abs(tau) < .5 ? 'tork yok: çubuk dönmez' : tau > 0 ? 'saat yönünün tersine döndürür' : 'saat yönünde döndürür'}`;

// Lab 2: seesaw
labs.lab2 = { st: { ang: 0 }, draw(c, dt) {
