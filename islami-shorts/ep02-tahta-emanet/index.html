</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="pp">Oynat</button><input id="sl" type="range" min="0" max="60" step="0.033" value="0"><span id="tm">0.0</span></div>
<audio id="a1" src="narration.wav" preload="auto"></audio><audio id="a2" src="soundtrack.wav" preload="auto"></audio>
<script src="script.js"></script>

<script src="ayat.js"></script>
<script>
const capMode = location.search.includes('capture=1'); if (capMode) document.body.classList.add('cap');
const cv = document.getElementById('c'), x = cv.getContext('2d'), W = 1080, H = 1920, PI = Math.PI, TAU = PI * 2;
const TL = window.TIMELINE || EP.estimateTimeline(), LN = TL.lines, DUR = TL.duration, C = EP.cues(TL), S = C.scenes; window.DURATION = DUR;
const cl = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, v) => { if (a === b) return v >= b ? 1 : 0; const t = cl((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = k => 1 - Math.pow(1 - cl(k, 0, 1), 3), easeBack = k => { const c = 1.6; k = cl(k, 0, 1); return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const R = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
let T = 0;
const sceneOf = t => { for (const n of EP.SCENES) if (t >= S[n].start && t < S[n].end) return n; return EP.SCENES[EP.SCENES.length - 1]; };
const SERIF = (sz, w = 700, it = false) => `${it ? 'italic ' : ''}${w} ${sz}px Amiri, Georgia, serif`, AR = sz => `400 ${sz}px "Amiri Quran", Amiri, serif`, MS = (sz, w = 700) => `${w} ${sz}px Montserrat, sans-serif`;
function hexA(c, a) { const v = parseInt(c.slice(1), 16); return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`; }
function mix(a, b, k) { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, '0')).join(''); }
function txt(s, px, py, font, col, a = 1, align = 'center', o = {}) {
  if (a <= 0 || !s) return; x.save(); x.globalAlpha *= a; x.translate(px, py); if (o.scale) x.scale(o.scale, o.scale);
  x.font = font; x.textAlign = align; x.textBaseline = 'middle'; x.direction = o.rtl ? 'rtl' : 'ltr';
  if (o.shadow !== false) { x.shadowColor = o.shadowCol || 'rgba(30,15,5,.55)'; x.shadowBlur = o.blur ?? 14; x.shadowOffsetY = 3; }
  x.fillStyle = col; x.fillText(s, 0, 0); x.restore();
}
const fillPath = (col, fn) => { x.beginPath(); fn(); x.fillStyle = col; x.fill(); };
const ell = (cx, cy, rx, ry, col, rot = 0) => fillPath(col, () => x.ellipse(cx, cy, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU));
const circ = (cx, cy, r, col) => ell(cx, cy, r, r, col);
function rrect(x0, y0, w, h, r, col) { x.beginPath(); x.roundRect(x0, y0, w, h, r); x.fillStyle = col; x.fill(); }
function cap(x0, y0, x1, y1, w, col) { x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.lineWidth = w; x.lineCap = 'round'; x.strokeStyle = col; x.stroke(); }
function wrap(s, maxW, font) { x.save(); x.font = font; const ws = s.split(' '), out = []; let cur = ''; for (const w of ws) { const t2 = cur ? cur + ' ' + w : w; if (x.measureText(t2).width > maxW && cur) { out.push(cur); cur = w; } else cur = t2; } if (cur) out.push(cur); x.restore(); return out; }
function cam(z, fx, fy) { x.translate(W / 2, H / 2); x.scale(z, z); x.translate(-fx, -fy); }

/* ================= environment ================= */
function skyGrad(c0, c1, c2, hy) { const g = x.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, c0); g.addColorStop(0.6, c1); g.addColorStop(1, c2); x.fillStyle = g; x.fillRect(0, 0, W, hy + 4); }
function sunGlow(cx, cy, r, col, k = 1) { const g = x.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 6 * k); g.addColorStop(0, hexA(col, 0.9)); g.addColorStop(0.3, hexA(col, 0.3)); g.addColorStop(1, hexA(col, 0)); x.fillStyle = g; x.fillRect(0, 0, W, H); circ(cx, cy, r, col); }
function stars(n, a = 1, maxY = 1000) { for (let i = 0; i < n; i++) { const k = 0.4 + 0.6 * Math.abs(Math.sin(T * 1.2 + i)); x.fillStyle = `rgba(255,246,220,${k * 0.85 * a})`; x.beginPath(); x.arc(R(i) * W, R(i + 200) * maxY, 0.8 + R(i + 400) * 2.2, 0, TAU); x.fill(); } }
function moon(cx, cy, r, sky) { x.save(); x.shadowColor = '#ffeec0'; x.shadowBlur = 60; circ(cx, cy, r, '#fff1c8'); x.restore(); circ(cx + r * 0.42, cy - r * 0.2, r * 0.86, sky); }
function clouds(n, y0, y1, col = '#fffaf0', a = 0.85) { x.save(); x.globalAlpha = a; for (let i = 0; i < n; i++) { const cx = ((R(i) * W + T * (6 + i * 3)) % (W + 400)) - 200, cy = y0 + R(i + 5) * (y1 - y0); for (let j = 0; j < 4; j++) ell(cx + j * 46 - 70, cy - (j % 3 ? 18 : 0), 48 + (j % 2) * 10, 30 + (j % 2) * 8, col); ell(cx, cy + 12, 120, 20, col); } x.restore(); }
function sea(hy, top, bot, o = {}) {
  const g = x.createLinearGradient(0, hy, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot); x.fillStyle = g; x.fillRect(0, hy, W, H - hy);
  x.save(); x.lineCap = 'round';
  for (let i = 0; i < 26; i++) { const k = i / 26, yy = hy + 10 + Math.pow(k, 1.6) * (H - hy), amp = 2 + k * 9, len = 30 + k * 120; x.strokeStyle = `rgba(255,255,255,${0.12 + 0.18 * (1 - k)})`; x.lineWidth = 1.5 + k * 3;
    for (let j = 0; j < 5; j++) { const px = ((R(i * 7 + j) * W + T * (12 + k * 30) * (j % 2 ? 1 : -1)) % (W + 300)) - 150; x.beginPath(); x.moveTo(px, yy); x.quadraticCurveTo(px + len / 2, yy - amp + Math.sin(T * 2 + i + j) * amp * 0.5, px + len, yy); x.stroke(); } }
  if (o.glint) { x.globalAlpha = o.glint; for (let i = 0; i < 40; i++) { const px = o.gx + (R(i) - 0.5) * 220 * (1 + R(i + 3) * 2), py = hy + 8 + R(i + 9) * 260; ell(px, py, 10 + R(i) * 22, 2, '#fff6d8'); } }
  x.restore();
}
function waveY(px, base, amp = 10) { return base + Math.sin(px * 0.012 + T * 1.8) * amp + Math.sin(px * 0.031 - T * 1.2) * amp * 0.4; }
function beach(hy, sand, wet, foam = 0) { x.beginPath(); x.moveTo(0, H); x.lineTo(0, hy); for (let px = 0; px <= W; px += 20) x.lineTo(px, hy + Math.sin(px * 0.006) * 14 + px * 0.04); x.lineTo(W, H); x.closePath(); x.fillStyle = sand; x.fill(); }
function ship(cx, cy, s, sail = '#f3ead6', hull = '#6d4428') {
  x.save(); x.translate(cx, cy); x.rotate(Math.sin(T * 1.5) * 0.03); x.scale(s, s);
  cap(0, -10, 0, -210, 8, '#5a3820');
  fillPath(sail, () => { x.moveTo(6, -200); x.quadraticCurveTo(110, -130, 100, -30); x.lineTo(6, -30); x.closePath(); });
  fillPath(hexA('#000000', 0.08), () => { x.moveTo(6, -200); x.quadraticCurveTo(50, -140, 40, -30); x.lineTo(6, -30); x.closePath(); });
  fillPath(sail, () => { x.moveTo(-6, -190); x.quadraticCurveTo(-80, -120, -86, -40); x.lineTo(-6, -40); x.closePath(); });
  fillPath('#c0392b', () => { x.moveTo(0, -210); x.lineTo(30, -200); x.lineTo(0, -192); x.closePath(); });
  fillPath(hull, () => { x.moveTo(-150, -20); x.lineTo(150, -20); x.quadraticCurveTo(130, 30, 90, 36); x.lineTo(-100, 36); x.quadraticCurveTo(-140, 20, -150, -20); x.closePath(); });
  rrect(-150, -26, 300, 10, 4, '#8a5a34');
  x.restore();
}

/* ================= props ================= */
function coin(cx, cy, r, a = 1, rot = 0) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.translate(cx, cy); x.scale(Math.max(0.15, Math.abs(Math.cos(rot))), 1); circ(0, 0, r, '#e9b84a'); circ(0, 0, r * 0.78, '#f6d27a'); circ(0, 0, r * 0.62, '#e9b84a'); x.restore(); }
function pouch(cx, cy, s, a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.translate(cx, cy); x.scale(s, s); fillPath('#8a5a2e', () => { x.moveTo(-20, -18); x.quadraticCurveTo(-36, 10, -24, 30); x.quadraticCurveTo(0, 40, 24, 30); x.quadraticCurveTo(36, 10, 20, -18); x.closePath(); }); fillPath('#6e4522', () => { x.moveTo(-14, -18); x.lineTo(14, -18); x.lineTo(18, -26); x.lineTo(-18, -26); x.closePath(); }); cap(-16, -16, 16, -16, 4, '#d9a24e'); coin(10, -28, 7); x.restore(); }
function scroll(cx, cy, s, rot = 0, a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.translate(cx, cy); x.rotate(rot); x.scale(s, s); rrect(-34, -10, 68, 20, 8, '#f3e6c4'); circ(-34, 0, 10, '#e2cf9f'); circ(34, 0, 10, '#e2cf9f'); cap(-10, -10, -10, 10, 3, '#b5553a'); x.restore(); }
// log: horizontal, centre (cx,cy), length L. hollow 0..1 carved slot, plug 0..1 closed, split 0..1 broken open
function log(cx, cy, L, o = {}) {
  const r = L * 0.13; x.save(); x.translate(cx, cy); x.rotate(o.rot || 0);
  if (o.split > 0) {
    const d = o.split * L * 0.18, lift = o.split * r * 0.6;
    for (const sd of [-1, 1]) { x.save(); x.translate(sd * d, -lift * (sd > 0 ? 0.3 : 0)); x.rotate(sd * o.split * 0.25); x.beginPath(); x.rect(sd < 0 ? -L / 2 : 0, -r, L / 2, r * 2); x.clip(); logBody(L, r, o); x.restore(); }
    x.restore(); return;
  }
  logBody(L, r, o); x.restore();
}
function logBody(L, r, o) {
  rrect(-L / 2, -r, L, r * 2, r, '#8b5a33');
  rrect(-L / 2, -r, L, r * 0.7, r, '#a06a3d');
  x.save(); x.strokeStyle = 'rgba(70,40,20,.45)'; x.lineWidth = r * 0.08; for (let i = 0; i < 6; i++) { const px = -L / 2 + L * (0.12 + i * 0.15); x.beginPath(); x.moveTo(px, -r * 0.6); x.quadraticCurveTo(px + L * 0.05, 0, px, r * 0.7); x.stroke(); } x.restore();
  ell(L / 2 - r * 0.15, 0, r * 0.32, r * 0.98, '#d8a86c'); ell(L / 2 - r * 0.15, 0, r * 0.2, r * 0.6, '#c4925a');
  if (o.hollow > 0) { const hw = L * 0.42 * o.hollow; rrect(-hw / 2, -r * 0.55, hw, r * 0.7, r * 0.3, '#3b2414'); }
  if (o.coins > 0) { const n = Math.floor(o.coins * 9); for (let i = 0; i < n; i++) coin(-L * 0.17 + i * L * 0.042, -r * 0.25, r * 0.22); }
  if (o.letter > 0) scroll(L * 0.08, -r * 0.3, r * 0.011 * o.letter, 0, o.letter);
  if (o.plug > 0) { const hw = L * 0.42; x.save(); x.globalAlpha = o.plug; x.translate(0, -(1 - o.plug) * r * 1.6); rrect(-hw / 2 - 4, -r * 0.62, hw + 8, r * 0.36, r * 0.18, '#b07a46'); for (const px of [-hw * 0.4, 0, hw * 0.4]) circ(px, -r * 0.45, r * 0.06, '#5b3a1e'); x.restore(); }
  if (o.glow > 0) { x.save(); x.globalAlpha = o.glow; x.globalCompositeOperation = 'lighter'; const g = x.createRadialGradient(0, -r * 0.4, 2, 0, -r * 0.4, L * 0.5); g.addColorStop(0, 'rgba(255,214,120,.8)'); g.addColorStop(1, 'rgba(255,214,120,0)'); x.fillStyle = g; x.fillRect(-L, -L, L * 2, L * 2); x.restore(); }
}

/* ================= people (side view, original flat design) ================= */
const PEOPLE = {
  borclu: { skin: '#d6a07a', skinD: '#bf8961', beard: '#4a3223', robe: '#efe4c9', robeD: '#dacaa6', vest: '#3f6e78', vestD: '#2f565e', sash: '#c4813a', head: 'cloth', cloth: '#f6f1e6', clothD: '#e2dbcc', band: '#3b2f28', legs: '#4b3a2c', shoe: '#6b4327' },
  alacakli: { skin: '#dfb08c', skinD: '#c99872', beard: '#b4ada3', robe: '#e6e2da', robeD: '#cfc9bd', vest: '#7a3f35', vestD: '#622f27', sash: '#d9a24e', head: 'turban', cloth: '#f2e7cf', clothD: '#ddcfb0', band: '#c9a46a', legs: '#5a4636', shoe: '#4a2f1d' },
};
function limb(x0, y0, a1, l1, a2, l2) { const ex = x0 + Math.sin(a1) * l1, ey = y0 + Math.cos(a1) * l1, hx = ex + Math.sin(a1 + a2) * l2, hy = ey + Math.cos(a1 + a2) * l2; return [ex, ey, hx, hy]; }
function person(cx, base, h, P, o = {}) {
  const u = h / 100, d = o.dir ?? 1; x.save(); x.translate(cx, base); x.scale(u * d, u);
  const ph = o.walk ?? null, kn = o.kneel ?? 0, bob = ph != null ? -Math.abs(Math.sin(ph)) * 1.2 : 0;
  if (!o.noShadow) ell(0, 0, 24, 3.6, 'rgba(60,35,15,.2)');
  x.translate(0, bob + kn * 16);
  // legs
  if (kn < 0.5) for (const [side, sgn] of [[0, -1], [1, 1]]) { const sw = ph != null ? Math.sin(ph) * sgn : 0, fx = sw * 11, lift = ph != null ? Math.max(0, Math.cos(ph) * sgn) * 3 : 0; cap(sgn * 1.5, -20, fx, -3 - lift, 6, side ? P.legs : mix(P.legs, '#000000', 0.15)); rrect(fx - 4, -6 - lift, 13, 6.5, 3, side ? P.shoe : mix(P.shoe, '#000000', 0.2)); }
  else { cap(-4, -20, -18, -16, 7, mix(P.legs, '#000000', 0.15)); rrect(-26, -20, 12, 6, 3, mix(P.shoe, '#000000', 0.2)); cap(4, -20, 16, -18, 7, P.legs); cap(16, -18, 16, -3 - 16, 6.5, P.legs); }
  // back arm
  const aB = o.armB ?? [ph != null ? -Math.sin(ph) * 0.5 : 0.08, 0.25];
  { const [ex, ey, hx, hy] = limb(-2, -76, aB[0], 15, aB[1], 14); cap(-2, -76, ex, ey, 6.4, P.robeD); cap(ex, ey, hx, hy, 5.6, P.robeD); circ(hx, hy, 3.4, P.skinD); if (o.holdB) item(o.holdB, hx, hy, o); }
  // robe + vest
  const hem = kn > 0.5 ? -18 : -16;
  fillPath(P.robe, () => { x.moveTo(-8, -80); x.quadraticCurveTo(-13, -78, -13, -70); x.lineTo(-16, hem); x.quadraticCurveTo(0, hem + 3, 16, hem); x.lineTo(12, -70); x.quadraticCurveTo(12, -78, 6, -80); x.closePath(); });
  fillPath(P.robeD, () => { x.moveTo(-8, -80); x.quadraticCurveTo(-13, -78, -13, -70); x.lineTo(-16, hem); x.quadraticCurveTo(-8, hem + 2, -4, hem + 1.5); x.lineTo(-4, -72); x.closePath(); });
  fillPath(P.vest, () => { x.moveTo(-9, -80); x.quadraticCurveTo(-14, -77, -14, -70); x.lineTo(-15, -30); x.lineTo(-1, -30); x.lineTo(1, -78); x.closePath(); });
  fillPath(P.vestD, () => { x.moveTo(-14, -70); x.lineTo(-15, -30); x.lineTo(-9, -30); x.lineTo(-9, -70); x.closePath(); });
  fillPath(P.sash, () => { x.moveTo(-14, -50); x.lineTo(13, -50); x.lineTo(13.5, -45); x.lineTo(-14.5, -45); x.closePath(); });
  // head
  x.save(); x.translate(2, -88); x.rotate(o.look ?? 0);
  cap(0, 4, 0, 9, 7, P.skinD); circ(0, 0, 9, P.skin);
  fillPath(P.skin, () => { x.moveTo(6, -2); x.quadraticCurveTo(11, 1, 8.5, 3.5); x.lineTo(6, 3); x.closePath(); });
  fillPath(P.beard, () => { x.moveTo(-4, 1); x.quadraticCurveTo(-3, 10.5, 3, 12); x.quadraticCurveTo(9, 10.5, 9, 4); x.quadraticCurveTo(6, 6.5, 2, 5); x.quadraticCurveTo(-1, 4, -4, 1); x.closePath(); });
  if (o.smile) { x.beginPath(); x.moveTo(3.4, 5.6); x.quadraticCurveTo(6, 7.4, 8.2, 5.2); x.lineWidth = 0.9; x.strokeStyle = '#2b1a10'; x.stroke(); }
  if (o.talk) { const m = 0.6 + 0.6 * Math.abs(Math.sin(T * 14)); ell(6, 6, 1.6, m, '#3a1a10'); }
  const bl = ((T + (o.seed || 0)) % 3.9) < 0.12;
  if (o.eyesClosed || bl) { x.beginPath(); x.moveTo(3.2, -2.2); x.quadraticCurveTo(4.6, -1.2, 6, -2.2); x.lineWidth = 0.9; x.strokeStyle = '#2b1a10'; x.stroke(); } else circ(4.6, -2.4, 1.15, '#2b1a10');
  x.beginPath(); x.moveTo(2.6, -5.4 - (o.brow || 0)); x.lineTo(6.6, -5.2 + (o.brow || 0) * 0.6); x.lineWidth = 1.2; x.strokeStyle = mix(P.beard, '#000000', 0.2); x.stroke();
  if (P.head === 'cloth') {
    fillPath(P.cloth, () => { x.moveTo(-10.5, 4); x.quadraticCurveTo(-12, -11, 0, -11.5); x.quadraticCurveTo(10, -11, 9.6, -4); x.lineTo(5, -5); x.quadraticCurveTo(-2, -6, -3, 0); x.quadraticCurveTo(-4, 8, -8, 18); x.quadraticCurveTo(-13, 14, -10.5, 4); x.closePath(); });
    fillPath(P.clothD, () => { x.moveTo(-10.5, 4); x.quadraticCurveTo(-12, 12, -8, 18); x.quadraticCurveTo(-6, 10, -7, 2); x.closePath(); });
    fillPath(P.band, () => { x.moveTo(-10, -6.5); x.quadraticCurveTo(0, -9.5, 9.8, -6.2); x.lineTo(9.6, -4.2); x.quadraticCurveTo(0, -7.4, -10.2, -4.4); x.closePath(); });

    x.save(); x.strokeStyle = P.clothD; x.lineWidth = 1.1; for (const yy of [-6, -9.5, -13]) { x.beginPath(); x.moveTo(-10, yy + 3); x.quadraticCurveTo(0, yy - 1, 10, yy + 1.5); x.stroke(); } x.restore();
    fillPath(P.band, () => { x.moveTo(-10.4, -2.6); x.quadraticCurveTo(0, -6.8, 10.2, -3.4); x.lineTo(10, -1.8); x.quadraticCurveTo(0, -5, -10.2, -1); x.closePath(); });
  }
  x.restore();
  // front arm
  const aF = o.armF ?? [ph != null ? Math.sin(ph) * 0.5 : 0.1, 0.2];
  { const [ex, ey, hx, hy] = limb(3, -76, aF[0], 15, aF[1], 14); cap(3, -76, ex, ey, 6.6, P.robe); cap(ex, ey, hx, hy, 5.8, P.robe); circ(hx, hy, 3.6, P.skin); if (o.hold) item(o.hold, hx, hy, o); }

}
function item(kind, hx, hy, o) {

  if (kind === 'axe') { x.save(); x.translate(hx, hy); x.rotate(o.axeRot ?? 0); cap(0, 6, 0, -34, 3.2, '#7a5232'); fillPath('#9aa3ab', () => { x.moveTo(0, -34); x.lineTo(14, -38); x.quadraticCurveTo(18, -30, 14, -22); x.lineTo(0, -26); x.closePath(); }); x.restore(); }
  if (kind === 'knife') { x.save(); x.translate(hx, hy); x.rotate(o.knifeRot ?? 0.6); rrect(-2, -2, 9, 4, 1.5, '#6b4327'); fillPath('#c9d1d6', () => { x.moveTo(7, -2); x.lineTo(20, 0); x.lineTo(7, 2); x.closePath(); }); x.restore(); }
}
function bubble(cx, cy, w, lines, a, tail = 0, dark = false, size = 50) {
