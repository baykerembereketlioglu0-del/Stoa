<script>
const capMode = location.search.includes('capture=1'); if (capMode) document.body.classList.add('cap');
const cv = document.getElementById('c'), x = cv.getContext('2d'), W = 1080, H = 1920, PI = Math.PI, TAU = PI * 2;
const TL = window.TIMELINE || EP.estimateTimeline(), LN = TL.lines, DUR = TL.duration, C = EP.cues(TL), S = C.scenes; window.DURATION = DUR;

let T = 0;
const COL = { night: '#0a1a2a', deep: '#0d2f3a', gold: '#e6bf6a', gold2: '#f7dfa2', cream: '#fbf3e0', emerald: '#2fa37a', ink: '#132331', red: '#d9634e', mute: '#9fb3bf' };
const sceneOf = t => { for (const n of EP.SCENES) if (t >= S[n].start && t < S[n].end) return n; return 'cta'; };

function txt(s, px, py, font, col, a = 1, align = 'center', opt = {}) {
  if (a <= 0 || !s) return; x.save(); x.globalAlpha *= a; x.translate(px, py); if (opt.scale) x.scale(opt.scale, opt.scale); if (opt.rot) x.rotate(opt.rot);
  x.font = font; x.textAlign = align; x.textBaseline = 'middle'; x.direction = opt.rtl ? 'rtl' : 'ltr'; x.letterSpacing = (opt.ls || 0) + 'px';
  if (opt.glow) { x.shadowColor = opt.glow; x.shadowBlur = opt.blur || 40; }

}
function rr(x0, y0, w, h, r) { x.beginPath(); x.roundRect(x0, y0, w, h, r); }
function panel(x0, y0, w, h, a = 1, fill = 'rgba(8,24,36,.78)', line = COL.gold) { if (a <= 0) return; x.save(); x.globalAlpha *= a; rr(x0, y0, w, h, 28); x.fillStyle = fill; x.fill(); x.lineWidth = 3; x.strokeStyle = line; x.stroke(); rr(x0 + 10, y0 + 10, w - 20, h - 20, 20); x.lineWidth = 1.2; x.strokeStyle = 'rgba(230,191,106,.45)'; x.stroke(); x.restore(); }

// ---------- background: night sky + girih pattern ----------
const PAT = document.createElement('canvas'); PAT.width = 1400; PAT.height = 2240;
(() => { const p = PAT.getContext('2d'), s = 140; p.strokeStyle = 'rgba(230,191,106,.09)'; p.lineWidth = 2;
  for (let gy = 0; gy < PAT.height + s; gy += s) for (let gx = 0; gx < PAT.width + s; gx += s) {
    const cx = gx + (Math.floor(gy / s) % 2 ? s / 2 : 0), cy = gy;
    for (const rot of [0, PI / 4]) { p.save(); p.translate(cx, cy); p.rotate(rot); p.strokeRect(-s * 0.32, -s * 0.32, s * 0.64, s * 0.64); p.restore(); }
    p.beginPath(); p.arc(cx, cy, s * 0.12, 0, TAU); p.stroke();
  } })();
const STARS = [...Array(140)].map((_, i) => [R(i) * W, R(i + 300) * H * 0.75, 0.6 + R(i + 600) * 1.8, R(i + 900) * TAU]);
function bg(tint = 0) {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#06121e'); g.addColorStop(0.55, lerpCol('#0b2534', '#1c2a3a', tint)); g.addColorStop(1, '#0e3640'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (const [sx, sy, sr, ph] of STARS) { const a = 0.35 + 0.65 * Math.abs(Math.sin(T * 1.3 + ph)); x.fillStyle = `rgba(255,244,214,${a * 0.8})`; x.beginPath(); x.arc(sx, sy, sr, 0, TAU); x.fill(); }
  x.drawImage(PAT, -160 + (T * 6) % 140, -160 + (T * 3) % 140);
}
function lerpCol(a, b, k) { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function frame() { // ornamental border
  x.save(); x.strokeStyle = 'rgba(230,191,106,.75)'; x.lineWidth = 3; rr(28, 28, W - 56, H - 56, 26); x.stroke(); x.lineWidth = 1.2; x.strokeStyle = 'rgba(230,191,106,.4)'; rr(42, 42, W - 84, H - 84, 18); x.stroke(); x.restore();
  for (const [cx, cy] of [[28, 28], [W - 28, 28], [28, H - 28], [W - 28, H - 28]]) star8(cx, cy, 20, '#0b2232', COL.gold, 2.5);
}
function vignette() { const v = x.createRadialGradient(540, 900, 500, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.5)'); x.fillStyle = v; x.fillRect(0, 0, W, H); }
function medallion(n, cx, cy, k) { if (k <= 0) return; x.save(); x.translate(cx, cy); x.scale(easeBack(k), easeBack(k)); star8(0, 0, 78, '#0d2a38', COL.gold, 5, T * 0.2); star8(0, 0, 60, null, 'rgba(230,191,106,.5)', 2, -T * 0.2); txt(String(n), 0, 6, MS(84, 900), COL.gold2, 1); x.restore(); }
function progress(cur) { const ids = ['oku', 'meryem', 'kevser', 'borc', 'besmele']; ids.forEach((id, i) => { const px = 540 + (i - 2) * 92, on = ids.indexOf(cur) >= i, now = cur === id; x.save(); x.translate(px, 112); x.rotate(PI / 4); x.fillStyle = on ? COL.gold : 'rgba(230,191,106,.15)'; const s = now ? 26 : 18; x.fillRect(-s / 2, -s / 2, s, s); x.restore(); }); }
function title(s, y, a, size = 60) { txt(s, 540, y, MS(size, 800), COL.cream, a, 'center', { ls: 1 }); }

// ---------- props ----------
function mushaf(cx, cy, s, glow) {
  x.save(); x.translate(cx, cy); x.scale(s, s);
  if (glow > 0) { const g = x.createRadialGradient(0, -60, 20, 0, -60, 520); g.addColorStop(0, `rgba(255,220,140,${0.45 * glow})`); g.addColorStop(1, 'rgba(255,220,140,0)'); x.fillStyle = g; x.fillRect(-600, -600, 1200, 1100);
    x.save(); x.globalAlpha = 0.25 * glow; for (let i = 0; i < 9; i++) { const a = -PI / 2 + (i - 4) * 0.16 + Math.sin(T * 0.6 + i) * 0.02; x.beginPath(); x.moveTo(0, -40); x.lineTo(Math.cos(a - 0.03) * 700, Math.sin(a - 0.03) * 700); x.lineTo(Math.cos(a + 0.03) * 700, Math.sin(a + 0.03) * 700); x.closePath(); x.fillStyle = '#ffe2a6'; x.fill(); } x.restore(); }

  for (const sd of [-1, 1]) {
    x.beginPath(); x.moveTo(0, 30); x.quadraticCurveTo(sd * 140, -10, sd * 300, 20); x.lineTo(sd * 300, -250); x.quadraticCurveTo(sd * 140, -280, 0, -240); x.closePath();
    x.fillStyle = '#fbf1d9'; x.fill(); x.lineWidth = 6; x.strokeStyle = '#8c6a2a'; x.stroke();
    x.save(); x.clip(); x.strokeStyle = 'rgba(120,90,40,.35)'; x.lineWidth = 4; for (let i = 0; i < 9; i++) { const yy = -205 + i * 24; x.beginPath(); for (let k = 0; k <= 12; k++) { const xx = sd * (30 + k * 20); x.lineTo(xx, yy + 10 * (Math.abs(xx) / 300) * 0.5 + Math.sin(k * 1.7 + i) * 2.5 - Math.abs(xx) * 0.03); } x.stroke(); } x.restore();
    x.beginPath(); x.moveTo(sd * 20, 14); x.quadraticCurveTo(sd * 140, -22, sd * 282, 6); x.lineTo(sd * 282, -236); x.quadraticCurveTo(sd * 140, -262, sd * 20, -226); x.closePath(); x.lineWidth = 3; x.strokeStyle = COL.gold; x.stroke();
  }
  x.restore();
}
function mountains(glow, burst) {
  // far ridge
  x.fillStyle = '#0c2230'; x.beginPath(); x.moveTo(0, 1180); for (let i = 0; i <= 12; i++) x.lineTo(i * 90, 1100 - Math.sin(i * 1.3) * 40 - R(i) * 60); x.lineTo(W, H); x.lineTo(0, H); x.fill();
  // Nur Dağı
  x.fillStyle = '#081722'; x.beginPath(); x.moveTo(-40, 1300); x.lineTo(200, 1000); x.lineTo(380, 760); x.lineTo(470, 610); x.lineTo(540, 560); x.lineTo(610, 600); x.lineTo(720, 760); x.lineTo(880, 980); x.lineTo(1120, 1240); x.lineTo(1120, H); x.lineTo(-40, H); x.fill();
  x.strokeStyle = 'rgba(230,191,106,.25)'; x.lineWidth = 3; x.beginPath(); x.moveTo(200, 1000); x.lineTo(380, 760); x.lineTo(470, 610); x.lineTo(540, 560); x.lineTo(610, 600); x.lineTo(720, 760); x.lineTo(880, 980); x.stroke();
  // cave glow
  const cx = 560, cy = 660, g = x.createRadialGradient(cx, cy, 4, cx, cy, 160 + burst * 900); g.addColorStop(0, `rgba(255,226,160,${0.9 * glow})`); g.addColorStop(0.25, `rgba(255,200,110,${0.35 * glow})`); g.addColorStop(1, 'rgba(255,200,110,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = `rgba(255,236,190,${0.9 * glow})`; x.beginPath(); x.ellipse(cx, cy, 26, 18, -0.2, 0, TAU); x.fill();
  if (burst > 0) { x.save(); x.globalAlpha = burst * 0.5; for (let i = 0; i < 18; i++) { const a = i / 18 * TAU + T * 0.05; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a - 0.04) * 1600, cy + Math.sin(a - 0.04) * 1600); x.lineTo(cx + Math.cos(a + 0.04) * 1600, cy + Math.sin(a + 0.04) * 1600); x.closePath(); x.fillStyle = '#ffe6ad'; x.fill(); } x.restore(); }
}
function crescent(cx, cy, r, a = 1) { x.save(); x.globalAlpha = a; x.shadowColor = '#ffe6ad'; x.shadowBlur = 40; x.fillStyle = '#ffeec8'; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); x.globalCompositeOperation = 'destination-out'; x.shadowBlur = 0; x.beginPath(); x.arc(cx + r * 0.42, cy - r * 0.18, r * 0.86, 0, TAU); x.fill(); x.restore(); }
function palm(px, py, s, a = 1) {
  x.save(); x.globalAlpha = a; x.translate(px, py); x.scale(s, s);
  const top = [-40, -600];
  x.lineCap = 'round';
  for (let i = 0; i < 24; i++) { const k0 = i / 24, k1 = (i + 1) / 24, xa = Math.sin(k0 * 1.6) * top[0], ya = top[1] * k0, xb = Math.sin(k1 * 1.6) * top[0], yb = top[1] * k1; x.strokeStyle = i % 2 ? '#1a4556' : '#163b4a'; x.lineWidth = 46 - k0 * 18; x.beginPath(); x.moveTo(xa, ya); x.lineTo(xb, yb + 2); x.stroke(); x.strokeStyle = 'rgba(230,191,106,.28)'; x.lineWidth = 2; x.beginPath(); x.moveTo(xa - 20 + k0 * 8, ya); x.lineTo(xa + 20 - k0 * 8, ya - 6); x.stroke(); }
  const tx = Math.sin(1.6) * top[0], ty = top[1];

  fronds.forEach((a2, i) => { const sw = Math.sin(T * 1.1 + i) * 0.04, L = 300 - Math.abs(a2 + 1.57) * 30; x.save(); x.translate(tx, ty); x.rotate(a2 + sw);
    x.strokeStyle = '#1d5163'; x.lineWidth = 7; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(L * 0.55, -40, L, 50); x.stroke();
    for (let k = 1; k < 14; k++) { const q = k / 14, bx = L * q, by = -40 * 4 * q * (1 - q) * 0.55 + 50 * q * q; for (const sd of [-1, 1]) { x.strokeStyle = sd > 0 ? '#1f5a6c' : '#184a5a'; x.lineWidth = 6 - q * 3; x.beginPath(); x.moveTo(bx, by); x.lineTo(bx + 26 * (1 - q * 0.5), by + sd * 46 * (1 - q * 0.4) + 14); x.stroke(); } }
    x.restore(); });
  for (let i = 0; i < 9; i++) { x.fillStyle = i % 2 ? '#c9862f' : '#b3741f'; x.beginPath(); x.arc(tx - 36 + (i % 4) * 20, ty + 34 + Math.floor(i / 4) * 18, 10, 0, TAU); x.fill(); }
  x.restore();
}
function ayahMark(cx, cy, n, r = 30, col = COL.gold) { x.save(); x.lineWidth = 3; x.strokeStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.stroke(); star8(cx, cy, r * 1.25, null, 'rgba(230,191,106,.5)', 1.5); txt('٠١٢٣٤٥٦٧٨٩'[n] || String(n), cx, cy + 2, AR(r * 1.1), col, 1, 'center', { rtl: true }); x.restore(); }
function wrapRTL(s, maxW, font) { x.save(); x.font = font; x.direction = 'rtl'; const words = s.split(' '), lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); x.restore(); return lines; }
function wrapLTR(s, maxW, font) { x.save(); x.font = font; x.direction = 'ltr'; const words = s.split(' '), lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); x.restore(); return lines; }
const A = window.AYAT, OKU = A['96:1'].ar.split(' ')[0];
const DEBT_TR = A['2:282'].tr.slice(0, A['2:282'].tr.indexOf('yazınız.') + 8);

// ---------- scenes ----------
function sHook(t) {
  bg(); const k0 = ss(0.1, 0.8, t);
  mushaf(540, 1190, 1.15, 0.6 + 0.4 * Math.sin(T * 1.5) * 0.3 + ss(C.bes, C.bes + 0.5, t) * 0.4);
  txt("KUR'AN-I KERİM", 540, 330, AM(118, 700), COL.gold2, k0, 'center', { glow: 'rgba(255,210,120,.6)', blur: 30, ls: 2 });
  txt('hakkında çoğu kişinin', 540, 440, MS(50, 700), COL.cream, ss(0.4, 1.0, t));
  txt('bilmediği', 540, 506, MS(50, 700), COL.cream, ss(0.5, 1.1, t));
  const kb = ss(C.bes - 0.1, C.bes + 0.35, t); if (kb > 0) txt('5 BİLGİ', 540, 650, MS(170, 900), COL.gold, kb, 'center', { scale: easeBack(kb), glow: 'rgba(255,200,90,.5)', blur: 40 });
  const ks = ss(C.sonuncusu - 0.1, C.sonuncusu + 0.4, t); if (ks > 0) { panel(250, 1430, 580, 0, 0); txt('sonuncusu çok şaşırtıcı', 540, 790, MS(44, 800), COL.cream, ks, 'center', { rot: -0.02 }); x.save(); x.globalAlpha = ks; x.strokeStyle = COL.gold; x.lineWidth = 4; x.beginPath(); x.moveTo(300, 830); x.quadraticCurveTo(540, 850, 780, 830); x.stroke(); x.restore(); }
}
function sOku(t) {
  bg(); crescent(870, 300, 58, 0.9);
  const burst = ss(C.oku - 0.15, C.oku + 0.5, t);
  x.save(); const z = lerp(1.0, 1.08, ss(S.oku.start, C.oku, t)); x.translate(540, 900); x.scale(z, z); x.translate(-540, -900); mountains(0.5 + 0.5 * Math.sin(T * 2) * 0.2 + burst * 0.4, burst * (1 - ss(C.oku + 0.6, C.oku + 2, t) * 0.5)); x.restore();

  if (kh > 0) { panel(230, 390, 620, 150, kh); txt('HİRA MAĞARASI', 540, 445, MS(52, 900), COL.gold2, kh, 'center', { ls: 4 }); txt('Nur Dağı · Mekke', 540, 500, MS(34, 600), COL.cream, kh); x.save(); x.globalAlpha = kh; x.setLineDash([8, 8]); x.strokeStyle = COL.gold; x.lineWidth = 3; x.beginPath(); x.moveTo(540, 545); x.lineTo(558, 640); x.stroke(); x.restore(); }

}
