<!DOCTYPE html>

<style>

</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="pp">Oynat</button><input id="sl" type="range" min="0" max="70" step="0.033" value="0"><span id="tm">0.0s</span></div>
<audio id="a1" src="narration.wav" preload="auto"></audio><audio id="a2" src="soundtrack.wav" preload="auto"></audio>
<script src="script.js"></script>
<script src="timeline.js"></script>
<script>
// =====================================================================
//  STOA · Bölüm 01 · "Elinde Olan" — tüm çizimler bu dosyada, kodla.
//  render(t) saf bir fonksiyondur: aynı t → aynı kare (Playwright kaydı için).
// =====================================================================
const cv = document.getElementById('c'), x = cv.getContext('2d');
const W = 1080, H = 1920, PI = Math.PI, TAU = PI * 2;
const cap = location.search.includes('capture=1'); if (cap) document.body.classList.add('cap');
const TL = window.TIMELINE || EP.estimateTimeline(), LN = TL.lines, DUR = TL.duration;
const C = EP.cues(TL), S = C.scenes; window.DURATION = DUR;

const GOLD = '#d9a441', GOLD2 = '#f6d68c', INK = '#050304', BLOOD = '#b3121b';
const cl = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, v) => { const t = cl((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const R = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const easeBack = k => { const c = 1.9; k = cl(k, 0, 1); return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const low = s => s.toLocaleLowerCase('tr').replace(/[^\p{L}]/gu, '');
const UP = s => s.toLocaleUpperCase('tr');
x.lineJoin = 'round'; x.lineCap = 'round';

// ---------- önceden üretilen dokular ----------
let sd = 7; const rng = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const GRAIN = [...Array(6)].map(() => {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const g = c.getContext('2d'), d = g.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = rng() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 34; }
  g.putImageData(d, 0, 0); return c;
});
const glowCache = {};
function glow(col) { // yumuşak ışık lekesi (rgb "r,g,b")
  if (glowCache[col]) return glowCache[col];
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${col},1)`); gr.addColorStop(0.25, `rgba(${col},.45)`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return glowCache[col] = c;
}
function light(cx, cy, r, col, a) { if (a <= 0) return; x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = cl(a, 0, 1); x.drawImage(glow(col), cx - r, cy - r, r * 2, r * 2); x.restore(); }

// ---------- genel yardımcılar ----------
function poly(p) { x.beginPath(); x.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) x.lineTo(p[i], p[i + 1]); x.closePath(); }
function ell(cx, cy, rx, ry, r = 0) { x.beginPath(); x.ellipse(cx, cy, rx, ry, r, 0, TAU); }
function line(pts, w, col) { x.beginPath(); x.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]); x.lineWidth = w; x.strokeStyle = col; x.stroke(); }
function sceneOf(t) { for (const n of EP.SCENES) if (t >= S[n].start && t < S[n].end) return n; return 'outro'; }
function cam(t, keys) { // keys: [zaman, zoom, odakX, odakY, geçişSüresi]
  let z = keys[0][1], fx = keys[0][2], fy = keys[0][3];
  for (let i = 1; i < keys.length; i++) { const k = keys[i], e = ss(k[0], k[0] + (k[4] || 0.9), t); z = lerp(z, k[1], e); fx = lerp(fx, k[2], e); fy = lerp(fy, k[3], e); }
  fx = cl(fx, W / 2 / z, W - W / 2 / z); fy = cl(fy, H / 2 / z, H - H / 2 / z);
  x.translate(W / 2, H / 2); x.scale(z, z); x.translate(-fx, -fy);
}
function embers(t, n, col, sp, seed = 0, size = 1) {
  x.save(); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = R(i + seed), b = R(i * 1.7 + 50 + seed), c = R(i * 2.3 + 99 + seed), v = sp * (0.4 + b);
    const y = H + 60 - ((a * H * 1.4 + v * t) % (H * 1.4)), xx = c * W + Math.sin(t * (0.6 + a) + i) * 50;
    const r = (6 + b * 16) * size, fl = 0.35 + 0.65 * Math.abs(Math.sin(t * (2 + c * 3) + i));
    x.globalAlpha = fl * (0.5 + 0.5 * c); x.drawImage(glow(col), xx - r, y - r, r * 2, r * 2);
  }
  x.restore();
}
function smoke(t, n, col, a, seed = 0) {
  for (let i = 0; i < n; i++) {
    const r = 260 + R(i + seed) * 380, px = (R(i * 3 + seed) * (W + 600) + t * (12 + R(i) * 20)) % (W + 600) - 300;
    const py = 300 + R(i * 7 + seed) * 1400 + Math.sin(t * 0.3 + i) * 40;
    const g = x.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
}
// Alev: katmanlı damla şekli, titrer
function flame(cx, cy, s, t, seed = 0, int = 1) {
  if (s <= 0) return;
  light(cx, cy - 60 * s, 420 * s, '255,140,40', 0.55 * int);
  const layers = [['#7a1206', 1], ['#e2470f', 0.82], ['#ff9a1f', 0.6], ['#ffe08a', 0.38], ['#fffaf0', 0.2]];
  x.save(); x.globalCompositeOperation = 'lighter';
  layers.forEach(([col, k], li) => {
    const h = 190 * s * k * (1 + 0.08 * Math.sin(t * 13 + seed + li)), w = 62 * s * k * (1 + 0.1 * Math.sin(t * 9 + seed * 2));
    const sway = Math.sin(t * 5.3 + seed) * 16 * s * k + Math.sin(t * 11.7 + seed) * 6 * s;
    x.beginPath(); x.moveTo(cx + sway, cy - h);
    x.bezierCurveTo(cx + w * 0.5 + sway * 0.5, cy - h * 0.55, cx + w, cy - h * 0.2, cx + w * 0.75, cy - h * 0.02);
    x.quadraticCurveTo(cx, cy + h * 0.16, cx - w * 0.75, cy - h * 0.02);
    x.bezierCurveTo(cx - w, cy - h * 0.2, cx - w * 0.5 + sway * 0.5, cy - h * 0.55, cx + sway, cy - h);
    x.fillStyle = col; x.globalAlpha = (li === 0 ? 0.7 : 0.85) * int; x.fill();
  });
  x.restore();
}
function textC(s, px, py, font, col, ls = 0, a = 1) { x.save(); x.font = font; x.letterSpacing = ls + 'px'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.globalAlpha = a; x.fillStyle = col; x.fillText(s, px + ls / 2, py); x.restore(); }

// =====================================================================
//  SAHNE 1 · KANCA — çatlayan mermer büst
// =====================================================================
const BUST = document.createElement('canvas'); BUST.width = 800; BUST.height = 1000; const b = BUST.getContext('2d');
const CRACK = (() => { // ana çatlak + dallar (yerel büst koordinatı)
  const main = [[432, 150]]; for (let i = 1; i <= 16; i++) { const p = main[i - 1]; main.push([p[0] + (R(i * 4.1) - 0.55) * 70, p[1] + 48 + R(i * 2.7) * 14]); }
  const br = (from, n, dx, s) => { const o = [main[from].slice()]; for (let i = 1; i <= n; i++) { const p = o[i - 1]; o.push([p[0] + dx * (0.6 + R(i + s)), p[1] + 22 + R(i * 3 + s) * 26]); } return o; };
  return [main, br(4, 6, -34, 11), br(8, 5, 40, 23), br(11, 4, -30, 37)];
})();
function bustDraw(crack, eyes, t) {
  b.setTransform(1, 0, 0, 1, 0, 0); b.clearRect(0, 0, 800, 1000); b.lineCap = b.lineJoin = 'round';
  const base = '#cfc6ba';
  b.fillStyle = base;
  // omuzlar + göğüs (toga)
  b.beginPath(); b.moveTo(40, 1000); b.bezierCurveTo(60, 820, 220, 760, 330, 715); b.lineTo(470, 715); b.bezierCurveTo(580, 760, 740, 820, 760, 1000); b.closePath(); b.fill();
  b.fillRect(335, 560, 130, 200); // boyun
  b.beginPath(); b.ellipse(400, 370, 165, 205, 0, 0, TAU); b.fill(); // kafa
  for (let k = 0; k < 13; k++) { const a = PI * (1.08 + k * 0.069); b.beginPath(); b.arc(400 + Math.cos(a) * 158, 355 + Math.sin(a) * 196, 46 + R(k) * 10, 0, TAU); b.fill(); } // saç
  for (let k = 0; k < 11; k++) { const a = PI * (0.06 + k * 0.088); b.beginPath(); b.arc(400 + Math.cos(a) * 150, 470 + Math.sin(a) * 175, 44 + R(k + 9) * 10, 0, TAU); b.fill(); } // sakal
  b.beginPath(); b.ellipse(400, 560, 140, 120, 0, 0, TAU); b.fill();
  // gölgelendirme (yalnızca büstün üstüne)
  b.globalCompositeOperation = 'source-atop';
  let g = b.createLinearGradient(160, 0, 660, 0); g.addColorStop(0, 'rgba(255,250,240,.18)'); g.addColorStop(0.45, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.62)');
  b.fillStyle = g; b.fillRect(0, 0, 800, 1000);
  g = b.createLinearGradient(0, 120, 0, 1000); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(0.35, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  b.fillStyle = g; b.fillRect(0, 0, 800, 1000);
  g = b.createRadialGradient(400, 1150, 50, 400, 1150, 700); g.addColorStop(0, `rgba(220,30,25,${0.55 + 0.3 * eyes})`); g.addColorStop(1, 'rgba(220,30,25,0)');
  b.fillStyle = g; b.fillRect(0, 0, 800, 1000);
  // mermer damarları
  b.strokeStyle = 'rgba(90,78,70,.22)'; b.lineWidth = 2;
  for (let k = 0; k < 9; k++) { b.beginPath(); let px = R(k * 5) * 800, py = 200 + R(k * 9) * 700; b.moveTo(px, py); for (let j = 0; j < 6; j++) { px += 40 + R(k * 3 + j) * 50; py += (R(k + j * 7) - 0.5) * 70; b.lineTo(px, py); } b.stroke(); }
  // saç ve sakal bukleleri
  b.strokeStyle = 'rgba(55,42,36,.55)'; b.lineWidth = 5;
  for (let k = 0; k < 13; k++) { const a = PI * (1.08 + k * 0.069); b.beginPath(); b.arc(400 + Math.cos(a) * 150, 360 + Math.sin(a) * 188, 26, PI * 0.2, PI * 1.3); b.stroke(); }
  for (let k = 0; k < 15; k++) { const a = PI * (0.08 + k * 0.06), r = 70 + (k % 3) * 45; b.beginPath(); b.arc(400 + Math.cos(a) * r * 1.3, 480 + Math.sin(a) * r * 1.4, 22, PI * 1.1, PI * 2.1); b.stroke(); }
  // göz çukurları
  [[330, 352], [470, 352]].forEach(([ex, ey]) => {
    const gr = b.createRadialGradient(ex, ey, 4, ex, ey, 70); gr.addColorStop(0, 'rgba(20,12,10,.85)'); gr.addColorStop(1, 'rgba(20,12,10,0)');
    b.fillStyle = gr; b.beginPath(); b.ellipse(ex, ey, 70, 44, 0, 0, TAU); b.fill();
    b.fillStyle = eyes > 0.02 ? `rgba(${200 + 55 * eyes},${40 - 30 * eyes},${30},${0.35 + 0.65 * eyes})` : '#a8a096';
    b.beginPath(); b.ellipse(ex, ey + 4, 30, 15, 0, 0, TAU); b.fill();
  });
  // kaşlar (çatık), burun, bıyık, ağız
  b.strokeStyle = 'rgba(45,34,30,.7)'; b.lineWidth = 12;
  b.beginPath(); b.moveTo(272, 318); b.quadraticCurveTo(320, 290, 384, 326); b.stroke();
  b.beginPath(); b.moveTo(528, 318); b.quadraticCurveTo(480, 290, 416, 326); b.stroke();
  b.fillStyle = 'rgba(30,20,18,.38)'; b.beginPath(); b.moveTo(405, 350); b.lineTo(432, 448); b.lineTo(404, 470); b.closePath(); b.fill();
  b.strokeStyle = 'rgba(45,34,30,.75)'; b.lineWidth = 6; b.beginPath(); b.moveTo(372, 462); b.quadraticCurveTo(400, 482, 430, 462); b.stroke();
  b.fillStyle = 'rgba(70,55,48,.45)';
  b.beginPath(); b.moveTo(400, 488); b.bezierCurveTo(360, 480, 320, 500, 300, 540); b.bezierCurveTo(340, 520, 370, 516, 400, 512); b.fill();
  b.beginPath(); b.moveTo(400, 488); b.bezierCurveTo(440, 480, 480, 500, 500, 540); b.bezierCurveTo(460, 520, 430, 516, 400, 512); b.fill();
  b.strokeStyle = 'rgba(25,15,12,.8)'; b.lineWidth = 5; b.beginPath(); b.moveTo(372, 530); b.lineTo(428, 530); b.stroke();
  // toga kıvrımları
  b.strokeStyle = 'rgba(40,30,26,.45)'; b.lineWidth = 7;
  for (let k = 0; k < 5; k++) { b.beginPath(); b.moveTo(120 + k * 60, 1000); b.quadraticCurveTo(260 + k * 50, 860 - k * 10, 520 + k * 40, 760 + k * 18); b.stroke(); }
  // çatlak
  b.globalCompositeOperation = 'source-over';
  if (crack > 0) CRACK.forEach((pts, ci) => {
    const startK = ci === 0 ? 0 : 0.35 + ci * 0.15, k = cl((crack - startK) / (1 - startK), 0, 1); if (k <= 0) return;
    const n = (pts.length - 1) * k, m = Math.floor(n);
    b.beginPath(); b.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i <= m; i++) b.lineTo(pts[i][0], pts[i][1]);
    if (m < pts.length - 1) { const f = n - m; b.lineTo(lerp(pts[m][0], pts[m + 1][0], f), lerp(pts[m][1], pts[m + 1][1], f)); }
    b.strokeStyle = '#120806'; b.lineWidth = ci ? 7 : 12; b.stroke();
    b.globalCompositeOperation = 'lighter'; b.strokeStyle = `rgba(255,70,40,${0.5 + 0.5 * eyes})`; b.lineWidth = ci ? 2 : 4; b.stroke();
    b.globalCompositeOperation = 'source-over';
  });
}
function sceneHook(t) {
  const lt = t - S.hook.start, hit = C.hookHit;
  x.fillStyle = '#030202'; x.fillRect(-200, -200, W + 400, H + 400);
  const g = x.createRadialGradient(540, 1500, 50, 540, 1300, 1200); g.addColorStop(0, `rgba(120,10,12,${0.55 + 0.35 * ss(hit, hit + 0.5, t)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(-200, -200, W + 400, H + 400);
  smoke(t, 6, '90,20,20', 0.16, 3);
  const crack = ss(0.25, hit, t) * 0.62 + ss(hit, hit + 0.35, t) * 0.38, eyes = ss(hit, hit + 0.45, t);
  bustDraw(crack, eyes, t);
  x.save(); const z = 1.0 + lt * 0.018 + 0.05 * ss(hit, hit + 0.2, t);
  x.translate(540, 900 + Math.sin(t * 1.1) * 8); x.scale(1.28 * z, 1.28 * z); x.drawImage(BUST, -400, -430); x.restore();
  if (eyes > 0) { const ez = 1.28 * (1.0 + lt * 0.018 + 0.05); [[-70, -78], [70, -78]].forEach(([dx, dy]) => light(540 + dx * ez, 900 + dy * ez, 120 + 30 * Math.sin(t * 7), '255,40,30', eyes * 0.9)); }
  embers(t, 40, '255,90,40', 120, 1);
}

// =====================================================================
//  SAHNE 2 · ROMA — köle Epiktetos ve efendisi (siluet + kenar ışığı)
// =====================================================================
const EX = 360, EY = 1300, MX = 830, MY = 1310;
function column(cx, top, bot, w, broken, col) {
  x.fillStyle = col;
  x.fillRect(cx - w / 2 - 22, bot - 40, w + 44, 40); x.fillRect(cx - w / 2 - 10, bot - 62, w + 20, 24);
  if (broken) { poly([cx - w / 2, bot - 60, cx + w / 2, bot - 60, cx + w / 2, top + 40, cx + w * 0.2, top + 10, cx - w * 0.1, top + 60, cx - w / 2, top + 25]); x.fill(); }
  else { x.fillRect(cx - w / 2, top + 50, w, bot - top - 110); x.fillRect(cx - w / 2 - 26, top + 20, w + 52, 34); x.fillRect(cx - w / 2 - 40, top, w + 80, 24); }
  x.strokeStyle = 'rgba(255,120,90,.07)'; x.lineWidth = 4;
  for (let k = 1; k < 5; k++) { const fx = cx - w / 2 + (w * k) / 5; x.beginPath(); x.moveTo(fx, top + 70); x.lineTo(fx, bot - 70); x.stroke(); }
}
function brazier(bx, by, t, seed) {
  x.strokeStyle = '#0b0605'; x.lineWidth = 12;
  line([bx - 55, by + 170, bx, by + 30, bx + 55, by + 170], 12, '#0b0605'); line([bx, by + 30, bx, by + 170], 10, '#0b0605');
  x.fillStyle = '#120a07'; x.beginPath(); x.moveTo(bx - 85, by); x.quadraticCurveTo(bx, by + 80, bx + 85, by); x.closePath(); x.fill();
  flame(bx, by + 6, 1.05, t, seed, 1);
  light(bx, by - 40, 520, '255,110,40', 0.35 + 0.08 * Math.sin(t * 17 + seed));
}
function chain(x1, y1, x2, y2, sag, t) {
  const n = Math.floor(Math.hypot(x2 - x1, y2 - y1) / 17);
  for (let i = 0; i <= n; i++) {
    const s = i / n, px = lerp(x1, x2, s), py = lerp(y1, y2, s) + Math.sin(PI * s) * sag + Math.sin(t * 2 + s * 6) * 3;
    const s2 = Math.min(1, s + 0.01), qx = lerp(x1, x2, s2), qy = lerp(y1, y2, s2) + Math.sin(PI * s2) * sag;
    const a = Math.atan2(qy - py, qx - px);
    ell(px, py, 12, i % 2 ? 4 : 7, a); x.lineWidth = 5; x.strokeStyle = '#2a2523'; x.stroke();
    x.lineWidth = 1.5; x.strokeStyle = 'rgba(255,170,90,.35)'; x.stroke();
  }
}
// Epiktetos (oturuyor, sağa bakıyor). phi: bükülen alt bacağın açısı
function epictetus(c, phi, calm) {
  x.fillStyle = c; x.strokeStyle = c;
  poly([EX - 95, EY + 8, EX + 70, EY + 8, EX + 40, EY - 150, EX + 18, EY - 205, EX - 58, EY - 198, EX - 88, EY - 95]); x.fill(); // gövde + cüppe
  ell(EX - 8, EY - 258, 50, 54); x.fill();                                       // kafa
  poly([EX - 20, EY - 245, EX + 44, EY - 240, EX + 40, EY - 196, EX + 6, EY - 168, EX - 22, EY - 205]); x.fill(); // sakal
  poly([EX + 38, EY - 275, EX + 58, EY - 254, EX + 38, EY - 248]); x.fill();     // burun
  // sol bacak (dizi yukarıda)
  line([EX + 10, EY - 12, EX + 120, EY - 118, EX + 205, EY - 6], 44, c); ell(EX + 222, EY - 4, 34, 14); x.fill();
  // sağ bacak (uzanmış, efendinin elinde)
  const kx = EX + 175, ky = EY - 10, ax = kx + Math.cos(phi) * 150, ay = ky + Math.sin(phi) * 150;
  line([EX + 30, EY - 2, kx, ky], 46, c); line([kx, ky, ax, ay], 38, c);
  ell(ax + Math.cos(phi - 0.9) * 24, ay + Math.sin(phi - 0.9) * 24, 30, 14, phi - 0.9); x.fill();
  // kollar elleri dizde
  line([EX - 10, EY - 185, EX + 55, EY - 112, EX + 118, EY - 122], 30, c);
  return { ax, ay, kx, ky, wx: EX + 118, wy: EY - 122 };
}
function master(c, lean, hand0, t) {
  const MS = 0.8, hand = { ax: MX + (hand0.ax - MX) / MS, ay: MY + (hand0.ay - MY) / MS };
  x.save(); x.translate(MX, MY); x.scale(MS, MS); x.translate(-MX, -MY);
  x.fillStyle = c; x.strokeStyle = c;
  line([MX - 30, MY - 330, MX - 55, MY], 58, c); line([MX + 20, MY - 330, MX + 55, MY], 58, c);
  const hx = MX - 5, hy = MY - 330, rot = p => [hx + p[0] * Math.cos(-lean) - p[1] * Math.sin(-lean), hy + p[0] * Math.sin(-lean) + p[1] * Math.cos(-lean)];
  const body = [[-95, 40], [105, 50], [95, -170], [60, -300], [-80, -310], [-110, -150]].map(rot).flat();
  poly(body); x.fill();
  const [hdx, hdy] = rot([-25, -372]); ell(hdx, hdy, 58, 62); x.fill();

  x.save(); x.globalAlpha = a; x.translate(cx, cy);
  const g = x.createLinearGradient(-120, 0, 120, 0); g.addColorStop(0, '#8a6424'); g.addColorStop(0.5, GOLD2); g.addColorStop(1, '#7a5520'); x.fillStyle = g;
  x.fillRect(-150, -h / 2, 300, 26); x.fillRect(-120, -h / 2 + 26, 240, 22); // başlık
  x.beginPath(); x.arc(-110, -h / 2 + 50, 26, 0, TAU); x.arc(110, -h / 2 + 50, 26, 0, TAU); x.fill(); // voluts
  x.fillRect(-90, -h / 2 + 60, 180, h - 130); // gövde
  x.fillStyle = 'rgba(40,25,8,.55)'; for (let k = 1; k < 6; k++) x.fillRect(-90 + k * 30 - 3, -h / 2 + 78, 6, h - 166);
  x.fillStyle = g; x.fillRect(-120, h / 2 - 70, 240, 26); x.fillRect(-150, h / 2 - 44, 300, 44); // kaide
  x.restore();
}
function sceneOutro(t) {
  const st = S.outro.start, q = LN[15], lg = C.logo, logoK = ss(lg, lg + 0.5, t);
  x.fillStyle = '#040303'; x.fillRect(-200, -200, W + 400, H + 400);
  const qA = 1 - ss(lg - 0.3, lg, t);
  // mum
  if (qA > 0) {
    x.save(); x.globalAlpha = qA;
    const g = x.createLinearGradient(500, 0, 580, 0); g.addColorStop(0, '#6d5a45'); g.addColorStop(0.5, '#d8c6a6'); g.addColorStop(1, '#5c4a38');
    x.fillStyle = g; x.fillRect(500, 1260, 80, 300); ell(540, 1260, 40, 10); x.fillStyle = '#e8d8bc'; x.fill();
    line([540, 1262, 540, 1236], 4, '#1b1410'); x.fillStyle = '#18120e'; x.fillRect(420, 1550, 240, 30);
    x.restore();
    flame(540, 1240, 0.55 * qA, t, 9, qA);
    // soru metni: kelimeler söylendikçe belirir
    x.font = '900 92px Cinzel'; const ws = q.words.map(w => UP(w[0].replace(/[“”"…]/g, ''))), rows = [];
    let cur = []; ws.forEach((w, i) => { const test = [...cur.map(j => ws[j]), w].join(' '); if (x.measureText(test).width > 900 && cur.length) { rows.push(cur); cur = []; } cur.push(i); }); rows.push(cur);
    rows.forEach((r, ri) => {
      const full = x.measureText(r.map(i => ws[i]).join(' ')).width; let px = 540 - full / 2;
      r.forEach(i => {
        const k = ss(q.words[i][1] - 0.05, q.words[i][1] + 0.2, t), w = ws[i], gold = /ELİNDE|GERÇEKTEN/.test(w);
        if (k > 0) { x.save(); x.textBaseline = 'middle'; x.globalAlpha = k * qA; x.fillStyle = gold ? GOLD : '#efe5d3'; x.shadowColor = gold ? 'rgba(255,170,60,.7)' : 'rgba(0,0,0,0)'; x.shadowBlur = 24;
          const sc = 1.3 - 0.3 * easeBack(k); x.translate(px, 640 + ri * 120); x.scale(sc, sc); x.fillText(w, 0, 0); x.restore(); }
        px += x.measureText(w + ' ').width;
      });
    });
  }
  if (logoK > 0) {
    if (t < lg + 0.15) light(540, 900, 900, '255,210,140', 1 - (t - lg) / 0.15);
    light(540, 820, 700, '255,150,60', 0.35 * logoK);
    stoaColumn(540, 760, 420 * (0.85 + 0.15 * easeBack(logoK)), logoK);
    x.save(); x.font = '900 190px Cinzel'; x.letterSpacing = '34px'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.globalAlpha = logoK;
    const gx = ((t - lg) * 700) % 1600 - 300, g = x.createLinearGradient(gx - 160, 0, gx + 160, 0); g.addColorStop(0, GOLD); g.addColorStop(0.5, '#fff6dc'); g.addColorStop(1, GOLD);
    x.fillStyle = g; x.shadowColor = 'rgba(255,160,50,.5)'; x.shadowBlur = 40; x.fillText('STOA', 540 + 17, 1110); x.restore();
    textC('HER GÜN BİR DERS', 540, 1240, '700 44px Cinzel', '#eadfcf', 12, ss(lg + 0.3, lg + 0.8, t));
    const bA = ss(lg + 0.7, lg + 1.1, t), pulse = 1 + 0.04 * Math.sin((t - lg) * 6);
    if (bA > 0) { x.save(); x.globalAlpha = bA; x.translate(540, 1390); x.scale(pulse, pulse); x.beginPath(); x.roundRect(-190, -50, 380, 100, 50); x.fillStyle = GOLD; x.fill();
      x.font = '900 44px Cinzel'; x.letterSpacing = '8px'; x.fillStyle = '#140c05'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('TAKİP ET', 4, 2); x.restore(); }
  }
  embers(t, 40, '255,150,60', 110, 41, 0.9);
}

// =====================================================================
//  ALTYAZI — kelime kelime, vurgulu, zıplayan
// =====================================================================
const SUBS = [];
LN.forEach((l, li) => {
  if (l.scene === 'quote' || l.scene === 'outro') return;
  const emph = EP.LINES[li].emph || [], ws = l.words; let i = 0;
  while (i < ws.length) {
    const ch = [i]; let len = ws[i][0].length;
    while (i + ch.length < ws.length && ch.length < 3 && len + ws[i + ch.length][0].length + 1 <= 15 && !/[.,?!…:]["”]?$/.test(ws[i + ch.length - 1][0])) { len += ws[i + ch.length][0].length + 1; ch.push(i + ch.length); }
    SUBS.push({ s: ws[ch[0]][1], e: ws[ch[ch.length - 1]][2] + 0.3, words: ch.map(k => ({ t: UP(ws[k][0].replace(/[“”"]/g, '').replace(/[.,;:…]+$/, '')), s: ws[k][1], e: ws[k][2], em: emph.some(p => low(ws[k][0]).startsWith(p)) })) });
    i += ch.length;
  }
});
SUBS.forEach((u, i) => { if (i < SUBS.length - 1) u.e = Math.max(u.s + 0.2, Math.min(u.e, SUBS[i + 1].s)); });
function subtitles(t) {
  const u = SUBS.find(u => t >= u.s && t < u.e); if (!u) return;
  let fs = 104; x.font = `900 italic ${fs}px Inter`; const gap = () => x.measureText(' ').width * 1.35, full = () => u.words.reduce((a, w) => a + x.measureText(w.t).width, 0) + gap() * (u.words.length - 1);
  while (full() > 940) { fs -= 4; x.font = `900 italic ${fs}px Inter`; }
  const k = easeBack(ss(u.s, u.s + 0.14, t)), y = 1450; let px = 540 - full() / 2;
  x.save(); x.textBaseline = 'middle';
  u.words.forEach(w => {
    const ww = x.measureText(w.t).width, on = t >= w.s, cur = t >= w.s && t < w.e + 0.08, pop = cur ? 1 + 0.07 * (1 - ss(w.s, w.s + 0.12, t)) : 1;
    x.save(); x.translate(px + ww / 2, y); x.scale(pop * (0.75 + 0.25 * k), pop * (0.75 + 0.25 * k));
    x.lineWidth = 16; x.strokeStyle = '#000'; x.shadowColor = 'rgba(0,0,0,.9)'; x.shadowBlur = 20; x.shadowOffsetY = 4; x.textAlign = 'center';
    x.strokeText(w.t, 0, 0); x.shadowColor = 'transparent';
    x.fillStyle = w.em && on ? (u.s < S.rome.start ? '#ff3b2f' : GOLD) : on ? '#ffffff' : 'rgba(255,255,255,.55)';
    x.fillText(w.t, 0, 0); x.restore();
    px += ww + gap();
  });
  x.restore();
}

// =====================================================================
//  ANA RENDER
// =====================================================================
const SCN = { hook: sceneHook, rome: sceneRome, circle: sceneCircle, storm: sceneStorm, quote: sceneQuote, outro: sceneOutro };
const IMPACTS = [[C.booms[0], 10], [C.hookHit, 26], [C.snap, 42], ...C.lightning.map(v => [v, 18]), [S.quote.start, 12], [C.logo, 16]];
function render(t) {
  t = cl(t, 0, DUR - 1e-3);
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.shadowBlur = 0; x.letterSpacing = '0px';
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  let sh = 0; for (const [it, a] of IMPACTS) if (t >= it) sh += a * Math.exp(-(t - it) * 7);
  const name = sceneOf(t);
  x.save(); x.translate(W / 2 + Math.sin(t * 93) * sh, H / 2 + Math.cos(t * 71) * sh); x.scale(1 + sh * 0.002, 1 + sh * 0.002); x.translate(-W / 2, -H / 2);
  SCN[name](t);
  x.restore();
  // vinyet + film grenleri + tarama çizgileri
  const v = x.createRadialGradient(540, 920, 420, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.88)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  x.save(); x.globalCompositeOperation = 'overlay'; x.globalAlpha = 0.55; x.drawImage(GRAIN[Math.floor(t * 24) % GRAIN.length], 0, 0, W, H); x.restore();
  x.fillStyle = 'rgba(0,0,0,.08)'; for (let y = (Math.floor(t * 60) % 4); y < H; y += 4) x.fillRect(0, y, W, 1);
  // sahne geçişi: siyahtan açılma + glitch şeritleri
  for (const n of EP.SCENES.slice(1)) {
    const k = t - S[n].start;
    if (k >= 0 && k < 0.35) { x.fillStyle = `rgba(0,0,0,${1 - k / 0.35})`; x.fillRect(0, 0, W, H); }
    if (Math.abs(k) < 0.14) for (let i = 0; i < 9; i++) { const r = R(i + Math.floor(t * 40)), y = r * H, h = 30 + R(i * 3 + Math.floor(t * 40)) * 120, dx = (R(i * 7 + Math.floor(t * 40)) - 0.5) * 120; x.drawImage(cv, 0, y, W, h, dx, y, W, h); }
  }
  // flaşlar
  if (t >= C.snap && t < C.snap + 0.18) { x.fillStyle = `rgba(255,255,255,${0.9 * (1 - (t - C.snap) / 0.18)})`; x.fillRect(0, 0, W, H); }
  if (t >= C.snap + 0.1 && t < C.snap + 1.2) { x.fillStyle = `rgba(160,0,0,${0.32 * (1 - (t - C.snap - 0.1) / 1.1)})`; x.fillRect(0, 0, W, H); }
  if (t >= C.hookHit && t < C.hookHit + 0.25) { x.fillStyle = `rgba(200,20,20,${0.5 * (1 - (t - C.hookHit) / 0.25)})`; x.fillRect(0, 0, W, H); }
  if (t < 0.25) { x.fillStyle = `rgba(0,0,0,${1 - t / 0.25})`; x.fillRect(0, 0, W, H); }
  subtitles(t);
  // üst bilgi + ilerleme çubuğu
  const hdA = (1 - ss(C.logo - 0.4, C.logo, t)) * ss(0.3, 0.9, t);
  if (hdA > 0) { textC('STOA', 540, 150, '900 40px Cinzel', GOLD, 16, 0.9 * hdA); textC(`BÖLÜM ${EP.EPISODE.no} · ${EP.EPISODE.title}`, 540, 198, '700 24px Cinzel', '#cdbfa6', 8, 0.75 * hdA); }
  x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(0, 0, W, 8); x.fillStyle = GOLD; x.fillRect(0, 0, W * t / DUR, 8);
}

// ---------- başlat ----------
Promise.all(['900 40px Cinzel', '700 40px Cinzel', '600 italic 40px Cormorant', '900 italic 40px Inter'].map(f => document.fonts.load(f, 'ŞİĞÜÖÇışğ'))).then(() => {
  window.seekTo = t => { render(t); return true; };
  render(cap ? 0 : 0.8);
  if (cap) return;
  let now = 0, play = false, last = null;
  const pp = document.getElementById('pp'), sl = document.getElementById('sl'), tm = document.getElementById('tm'), A = [document.getElementById('a1'), document.getElementById('a2')];
  sl.max = DUR;
  const sync = () => A.forEach(a => { try { a.currentTime = now; play ? a.play().catch(() => {}) : a.pause(); } catch (e) {} });
  pp.onclick = () => { play = !play; pp.textContent = play ? 'Duraklat' : 'Oynat'; last = null; sync(); };
  sl.oninput = () => { now = +sl.value; render(now); sync(); };
  (function loop(ts) { if (play) { if (last != null) now += (ts - last) / 1000; if (now >= DUR) { now = 0; sync(); } render(now); sl.value = now; tm.textContent = now.toFixed(1) + 's'; } last = ts; requestAnimationFrame(loop); })();
});
